<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Start Games</title>
<style>
:root{--bg:#060d1a;--panel:#101e33;--panel2:#142640;--muted:#90a6c0;--grid:#294362;--neon:#36eaff;--green:#39ff9c;--blue:#26aaff;--red:#ff4167;--amber:#ffd34d}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;margin:0;padding:22px clamp(12px,2vw,34px) 38px;color:#f4faff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 50% -15%,#163a62 0%,transparent 55%),linear-gradient(135deg,rgba(36,95,146,.1) 1px,transparent 1px),linear-gradient(45deg,rgba(36,95,146,.1) 1px,transparent 1px),#060d1a;background-size:auto,42px 42px,42px 42px,auto}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 97%,rgba(36,234,255,.035) 100%);background-size:100% 5px;z-index:0}
body>*{position:relative;z-index:1}
h2{font-size:clamp(25px,3vw,40px);letter-spacing:.13em;text-transform:uppercase;text-align:center;margin:26px 0 14px;color:#f8fcff;text-shadow:0 0 20px rgba(54,234,255,.6);font-weight:900}
h2:after{content:'';display:block;width:170px;max-width:50%;height:3px;background:linear-gradient(90deg,transparent,var(--neon),transparent);margin:14px auto 0;box-shadow:0 0 15px var(--neon)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:rgba(12,27,49,.9);border:1px solid #2a527a;border-radius:14px;box-shadow:0 8px 28px #0007, inset 0 1px 0 #ffffff0c}
.left,.right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.topbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 23px}
.badge{background:linear-gradient(180deg,#172c49,#101f35);border:1px solid #365d83;border-radius:9px;padding:10px 16px;color:#e9f7ff;font-weight:700;box-shadow:inset 0 1px 0 #ffffff14,0 4px 14px #0004}
#area-info{color:var(--neon);border-color:#24849d;box-shadow:0 0 12px #1ce5ff1c}
.pill{border:1px solid #3e7666;background:#102c29;color:#adffdc;border-radius:7px;padding:4px 10px;font-size:.9rem}
.btn{border:1px solid transparent;border-radius:8px;min-height:38px;padding:8px 12px;font-size:.83rem;font-weight:800;letter-spacing:.025em;cursor:pointer;transition:filter .16s,transform .1s,box-shadow .16s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.15);box-shadow:0 0 15px currentColor}.btn:active:not(:disabled){transform:scale(.97)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-green{background:#1b8f5d;color:white;border-color:#36f9a0}.btn-red{background:#a62642;color:white;border-color:#ff4769}.btn-blue{background:#146bb1;color:white;border-color:#33b6ff}.btn-amber{background:#176c5a;color:#e8fff5;border-color:#2de0a6}.btn-gray{background:#283a53;color:#e0edff;border-color:#45617f}
input[type=search]{background:#071526;border:1px solid #385879;border-radius:8px;padding:10px 12px;color:white;outline:none;min-width:215px}input[type=search]:focus{border-color:var(--neon);box-shadow:0 0 0 2px #26dfff33}
.games-scroll{overflow:auto;max-height:calc(100vh - 250px);min-height:220px;border:1px solid #335a80;border-radius:13px;box-shadow:0 14px 35px #0008,0 0 28px #00aaff0d;background:#0a1527}
table{width:100%;min-width:1180px;border-spacing:0;border-collapse:separate;text-align:center;font-size:.9rem}
th,td{border-right:1px solid #29405d;border-bottom:1px solid #243a53;padding:11px 9px;vertical-align:middle}th:last-child,td:last-child{border-right:0}
thead th{position:sticky;top:0;z-index:4;background:#142b49;color:#c7e7ff;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
thead tr:first-child th{background:#0e2543;color:#fff;font-size:.94rem;font-weight:900;padding:16px 8px;top:0;border-bottom:2px solid #355d83}
thead tr:nth-child(2) th{top:51px;background:#162c47;color:#a7c5e3;z-index:3}
/* Encabezados de disciplina: fondo pleno y letras negras */
thead tr:first-child th:nth-child(3){background:#ffd53d;color:#000;border-bottom-color:#ffd53d;text-shadow:none}
thead tr:first-child th:nth-child(4){background:#39ed79;color:#000;border-bottom-color:#39ed79;text-shadow:none}
thead tr:first-child th:nth-child(5){background:#37aaff;color:#000;border-bottom-color:#37aaff;text-shadow:none}
thead tr:first-child th:nth-child(6){background:#ff5265;color:#000;border-bottom-color:#ff5265;text-shadow:none}
tbody tr:nth-child(odd){background:#0b1b30}tbody tr:nth-child(even){background:#0f2239}tbody tr:hover{background:#193350}
tbody td:nth-child(1){color:#82a7c6;font-weight:800}tbody td:nth-child(2){font-weight:800;color:#fff;min-width:165px}tbody td[id*='score-']{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.04rem;color:#e7f6ff}tbody td[id^='salto-score-']{color:#79f2bd}tbody td[id^='rotura-score-']{color:#ffdc8e}tbody td[id^='lucha-score-']{color:#8cd2ff}tbody td[id^='combate-score-']{color:#ff9cac}
.cell-muted{color:var(--muted)}.hint{color:var(--muted);font-size:.85rem}
@media(max-width:650px){body{padding:10px}.toolbar{padding:12px}.games-scroll{max-height:calc(100vh - 295px)}.btn{font-size:.77rem;padding:8px}h2{margin:20px 0 14px}}

/* v3: colores neón puros y contornos de disciplina de extremo a extremo */
:root{--salto-neon:#fff000;--rotura-neon:#39ff14;--lucha-neon:#00b7ff;--combate-neon:#ff1744}
#games-table thead tr:first-child th:nth-child(3){background:var(--salto-neon);color:#000;border-bottom:3px solid #050b16;box-shadow:inset 0 0 0 1px #fff8a0}
#games-table thead tr:first-child th:nth-child(4){background:var(--rotura-neon);color:#000;border-bottom:3px solid #050b16;box-shadow:inset 0 0 0 1px #baffaa}
#games-table thead tr:first-child th:nth-child(5){background:var(--lucha-neon);color:#000;border-bottom:3px solid #050b16;box-shadow:inset 0 0 0 1px #a3eaff}
#games-table thead tr:first-child th:nth-child(6){background:var(--combate-neon);color:#000;border-bottom:3px solid #050b16;box-shadow:inset 0 0 0 1px #ff93a6}
/* Cada celda conserva su borde fino; cada disciplina tiene bordes externos de 3px. */
#games-table .disc-salto{--disc-color:var(--salto-neon)}
#games-table .disc-rotura{--disc-color:var(--rotura-neon)}
#games-table .disc-lucha{--disc-color:var(--lucha-neon)}
#games-table .disc-combate{--disc-color:var(--combate-neon)}
#games-table .disc-start{border-left:3px solid var(--disc-color)!important}
#games-table .disc-end{border-right:3px solid var(--disc-color)!important}
#games-table thead tr:first-child th:nth-child(n+3){border-left:3px solid var(--disc-color);border-right:3px solid var(--disc-color)}
#games-table thead tr:first-child th:nth-child(3){--disc-color:var(--salto-neon)}
#games-table thead tr:first-child th:nth-child(4){--disc-color:var(--rotura-neon)}
#games-table thead tr:first-child th:nth-child(5){--disc-color:var(--lucha-neon)}
#games-table thead tr:first-child th:nth-child(6){--disc-color:var(--combate-neon)}
#games-table thead tr:nth-child(2) th{border-bottom:3px solid #3d5979}
#games-table thead tr:nth-child(2) th:nth-child(3),#games-table thead tr:nth-child(2) th:nth-child(6),#games-table thead tr:nth-child(2) th:nth-child(9),#games-table thead tr:nth-child(2) th:nth-child(11){border-left:3px solid var(--disc-color)!important}
#games-table thead tr:nth-child(2) th:nth-child(5),#games-table thead tr:nth-child(2) th:nth-child(8),#games-table thead tr:nth-child(2) th:nth-child(10),#games-table thead tr:nth-child(2) th:nth-child(13){border-right:3px solid var(--disc-color)!important}
#games-table thead tr:nth-child(2) th:nth-child(n+3):nth-child(-n+5){--disc-color:var(--salto-neon)}
#games-table thead tr:nth-child(2) th:nth-child(n+6):nth-child(-n+8){--disc-color:var(--rotura-neon)}
#games-table thead tr:nth-child(2) th:nth-child(n+9):nth-child(-n+10){--disc-color:var(--lucha-neon)}
#games-table thead tr:nth-child(2) th:nth-child(n+11):nth-child(-n+13){--disc-color:var(--combate-neon)}
#games-table tbody td{border-bottom-color:#3c5775;border-bottom-width:1.5px}
#games-table tbody tr:last-child td{border-bottom:3px solid #526f91}
#games-table tbody td[id^='salto-score-']{color:var(--salto-neon)}
#games-table tbody td[id^='rotura-score-']{color:var(--rotura-neon)}
#games-table tbody td[id^='lucha-score-']{color:var(--lucha-neon)}
#games-table tbody td[id^='combate-score-']{color:#ff6681}

/* v4: todos los bordes azul noche profundo, casi negro. */
:root{--border-night:#071426;--border-night-strong:#030c1b;--grid:var(--border-night)}
.toolbar,.badge,.pill,.btn,input[type=search],.games-scroll{border-color:var(--border-night)!important}
input[type=search]:focus{border-color:var(--border-night)!important}
#games-table th,#games-table td{border-right-color:var(--border-night)!important;border-bottom-color:var(--border-night)!important}
#games-table .disc-start,#games-table thead tr:first-child th:nth-child(n+3),#games-table thead tr:nth-child(2) th:nth-child(3),#games-table thead tr:nth-child(2) th:nth-child(6),#games-table thead tr:nth-child(2) th:nth-child(9),#games-table thead tr:nth-child(2) th:nth-child(11){border-left:3px solid var(--border-night-strong)!important}
#games-table .disc-end,#games-table thead tr:first-child th:nth-child(n+3),#games-table thead tr:nth-child(2) th:nth-child(5),#games-table thead tr:nth-child(2) th:nth-child(8),#games-table thead tr:nth-child(2) th:nth-child(10),#games-table thead tr:nth-child(2) th:nth-child(13){border-right:3px solid var(--border-night-strong)!important}
#games-table thead tr:first-child th,#games-table thead tr:nth-child(2) th,#games-table tbody tr:last-child td{border-bottom-color:var(--border-night-strong)!important}
#games-table thead tr:first-child th:nth-child(n+3){box-shadow:none}

/* v5: encabezado único compacto, más superficie visible para competidores */
body{padding-top:10px;padding-bottom:12px}
.toolbar-compact{display:flex;flex-direction:column;gap:8px;padding:9px 14px;margin-bottom:9px}
.toolbar-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;width:100%}
.toolbar-main .left{justify-content:flex-start}
.toolbar-main .right{justify-content:flex-end}
.toolbar-main h2{margin:0;white-space:nowrap;font-size:clamp(18px,2vw,27px);letter-spacing:.09em;line-height:1.1}
.toolbar-main h2:after{display:none}
.toolbar-stats{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;width:100%}
.toolbar-stats .badge{padding:5px 11px;font-size:.8rem}
.toolbar-stats .pill{padding:2px 8px;font-size:.8rem}
.toolbar-main .btn{min-height:34px;padding:6px 10px}
.toolbar-main input[type=search]{padding:7px 10px;min-width:170px}
.games-scroll{max-height:calc(100vh - 125px)}
@media(max-width:1100px){.toolbar-main{grid-template-columns:1fr auto}.toolbar-main h2{grid-column:1/-1;grid-row:1;text-align:center}.toolbar-main .left{grid-column:1;grid-row:2}.toolbar-main .right{grid-column:2;grid-row:2}}
@media(max-width:650px){.toolbar-compact{padding:8px;gap:7px}.toolbar-main{display:flex;flex-direction:column;gap:7px}.toolbar-main .left,.toolbar-main .right{justify-content:center}.toolbar-main h2{order:-1}.toolbar-main .btn{font-size:.72rem;padding:6px 8px}.toolbar-stats{gap:5px}.toolbar-stats .badge{padding:4px 7px;font-size:.72rem}.games-scroll{max-height:calc(100vh - 215px)}}

/* v6: métricas junto al título, todo en una sola franja */
.toolbar-compact{padding:8px 12px;margin-bottom:7px}
.toolbar-main{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.toolbar-main .left,.toolbar-main .right{flex:0 1 auto}
.toolbar-center{display:flex;align-items:center;justify-content:center;gap:12px;flex:1 1 auto;min-width:0;flex-wrap:wrap}
.toolbar-center h2{margin:0;flex:0 0 auto;white-space:nowrap;font-size:clamp(18px,1.7vw,26px)}
.toolbar-center .toolbar-stats{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;width:auto}
.toolbar-center .badge{padding:5px 8px;font-size:.75rem;white-space:nowrap}
.toolbar-center .pill{padding:2px 6px;font-size:.75rem}
.games-scroll{max-height:calc(100vh - 91px)}
@media(max-width:1450px){.toolbar-main{justify-content:center}.toolbar-center{order:0;flex-basis:100%}.toolbar-main .left{order:1}.toolbar-main .right{order:2}}
@media(max-width:650px){.toolbar-main{display:flex;flex-direction:column;gap:7px}.toolbar-center{order:0;gap:7px;flex-basis:auto}.toolbar-main .left{order:1}.toolbar-main .right{order:2}.toolbar-center .badge{font-size:.69rem;padding:4px 6px}.games-scroll{max-height:calc(100vh - 170px)}}
/* Neón de alta intensidad: fondos sólidos y brillo interno, tipografía negra */
:root{--salto-neon:#ffff00;--rotura-neon:#39ff14;--lucha-neon:#00e5ff;--combate-neon:#ff1744}
#games-table thead tr:first-child th:nth-child(3){background:#ffff00!important;color:#000!important;box-shadow:inset 0 0 15px #ffffff9c,0 0 15px #ffff0055!important}
#games-table thead tr:first-child th:nth-child(4){background:#39ff14!important;color:#000!important;box-shadow:inset 0 0 15px #eaffdc9c,0 0 15px #39ff1455!important}
#games-table thead tr:first-child th:nth-child(5){background:#00e5ff!important;color:#000!important;box-shadow:inset 0 0 15px #d6ffff9c,0 0 15px #00e5ff55!important}
#games-table thead tr:first-child th:nth-child(6){background:#ff1744!important;color:#000!important;box-shadow:inset 0 0 15px #ffcad69c,0 0 15px #ff174455!important}
/* v7: encabezado estrictamente de una sola línea; desplazamiento horizontal solo en pantallas estrechas */
.toolbar-compact{padding:8px 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.toolbar-main,.toolbar-main .left,.toolbar-main .right,.toolbar-center,.toolbar-center .toolbar-stats{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:center!important;gap:7px!important}
.toolbar-main{width:max-content;min-width:100%;justify-content:space-between!important}
.toolbar-main .left,.toolbar-main .right,.toolbar-center{flex:0 0 auto!important;order:initial!important}
.toolbar-center{min-width:0!important;gap:12px!important}
.toolbar-center h2{font-size:clamp(17px,1.5vw,23px);white-space:nowrap}
.toolbar-main .btn{min-height:32px;padding:5px 8px;font-size:.75rem}
.toolbar-main input[type=search]{min-width:0;width:145px;padding:6px 8px}
.toolbar-center .badge,.toolbar-main #area-info{font-size:.73rem;padding:5px 7px;white-space:nowrap}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
:root{--lucha-neon:#0066ff}
#games-table thead tr:first-child th:nth-child(5){background:#0066ff!important;box-shadow:inset 0 0 15px #99bbffb0,0 0 15px #0066ff88!important;color:#000!important}

/* v8: cuatro nombres de jueces bajo el encabezado */
.judges-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 8px}
.judge-name-card{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 12px;background:linear-gradient(145deg,#101e34,#091425);border:2px solid var(--judge-color);border-radius:9px;box-shadow:inset 0 0 14px #0007,0 0 10px color-mix(in srgb,var(--judge-color) 22%,transparent)}
.judge-name-card label{color:var(--judge-color);font-size:.86rem;font-weight:900;white-space:nowrap;letter-spacing:.06em}
.judge-name-card input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:#fff;font:600 .92rem inherit;font-family:inherit;padding:5px 0}
.judge-name-card input::placeholder{color:#91a2ba}
.judge-name-card:focus-within{box-shadow:0 0 17px color-mix(in srgb,var(--judge-color) 45%,transparent)}
.games-scroll{max-height:calc(100vh - 150px)}
@media(max-width:800px){.judges-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.games-scroll{max-height:calc(100vh - 205px)}}
@media(max-width:420px){.judge-name-card{padding:6px;gap:5px}.judge-name-card input{font-size:.78rem}}
/* v10: nombres en mayúsculas y encabezados compactos y fijos */
.judge-name-card input{text-transform:uppercase}
#games-table thead tr:first-child th{padding-top:7px!important;padding-bottom:7px!important;line-height:1.1!important;height:33px;box-sizing:border-box;z-index:12!important}
#games-table thead tr:nth-child(2) th{position:sticky!important;top:var(--alto-disciplinas,33px)!important;z-index:11!important;background:#162c47!important;background-clip:padding-box!important}
#games-table thead tr:first-child th{position:sticky!important;top:0!important;background-clip:padding-box!important}

/* v11: puntajes pendientes como raya; resultados con fondo de disciplina */
#games-table tbody td.score-result{background:var(--score-bg)!important;color:#000!important;font-weight:900!important;text-shadow:none!important;box-shadow:inset 0 0 12px #ffffff55}
#games-table tbody td.score-result.disc-salto{--score-bg:#ffff00}
#games-table tbody td.score-result.disc-rotura{--score-bg:#39ff14}
#games-table tbody td.score-result.disc-lucha{--score-bg:#0066ff}
#games-table tbody td.score-result.disc-combate{--score-bg:#ff1744}
#games-table tbody td.score-pending{color:#a4b3c8!important}

/* v13: el tono claro acompaña la fila clara de la tabla y viceversa. */
#games-table tbody tr:nth-child(odd) td.score-result.disc-salto{--score-bg:#e5e500}
#games-table tbody tr:nth-child(even) td.score-result.disc-salto{--score-bg:#ffff36}
#games-table tbody tr:nth-child(odd) td.score-result.disc-rotura{--score-bg:#31e30f}
#games-table tbody tr:nth-child(even) td.score-result.disc-rotura{--score-bg:#61ff41}
#games-table tbody tr:nth-child(odd) td.score-result.disc-lucha{--score-bg:#0059df}
#games-table tbody tr:nth-child(even) td.score-result.disc-lucha{--score-bg:#3186ff}
#games-table tbody tr:nth-child(odd) td.score-result.disc-combate{--score-bg:#e80c39}
#games-table tbody tr:nth-child(even) td.score-result.disc-combate{--score-bg:#ff4265}
/* La altura de las celdas combinadas debe ser calculada por el navegador.
   Forzar height:110px en un rowspan de dos filas causaba el desfase. */
#games-table{border-collapse:collapse!important}
#games-table tbody tr{height:50px!important}
#games-table tbody td{box-sizing:border-box!important;height:50px!important;padding-top:5px!important;padding-bottom:5px!important;vertical-align:middle!important;line-height:1.2}
#games-table tbody td[rowspan]{height:auto!important;min-height:0!important;padding-top:0!important;padding-bottom:0!important;vertical-align:middle!important}
#games-table tbody td.score-result{background-clip:padding-box!important;box-shadow:inset 0 0 10px #ffffff33!important}
#games-table tbody td[id^="lucha-score-"],#games-table tbody td[id^="combate-score-"]{padding-left:5px!important;padding-right:5px!important}

/* Acceso Master: modal HTML compatible con vistas previas que bloquean window.prompt */
#games-table .master-field{width:100%;min-width:65px;max-width:190px;background:#081d32;color:#fff;border:1px solid #ffd34d;border-radius:5px;padding:6px;font:inherit}
#games-table td:nth-child(2) .master-field{min-width:150px}
#master-status{color:#ffd34d;font-weight:800;font-size:.75rem}
#btn-master.active{background:#ffd34d;color:#071526}
/* Acceso Master unificado: solo se muestra el control inferior derecho. */
#btn-master{display:none!important}
.master-modal[hidden]{display:none!important}
.master-modal{position:fixed;inset:0;z-index:99999;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px}
.master-dialog{width:min(420px,100%);background:#101e33;border:2px solid #ffd34d;border-radius:15px;padding:24px;box-shadow:0 18px 70px #000b;color:#fff}
.master-dialog h3{margin:0 0 12px;color:#ffd34d;letter-spacing:.08em}
.master-dialog p{color:#bbcee2;font-size:.9rem}
.master-dialog input{width:100%;padding:12px;border-radius:8px;border:1px solid #6383a4;background:#071526;color:white;font-size:1rem}
.master-dialog .master-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.master-dialog .master-error{color:#ff718c;min-height:20px;font-size:.85rem;margin-top:8px}
/* Métricas alineadas con el selector de área, a la derecha del título. */
.toolbar-main .right .toolbar-stats{display:flex;align-items:center;justify-content:flex-end;flex-wrap:nowrap;width:auto;gap:7px}
.toolbar-main .right .toolbar-stats .badge{font-size:.73rem;padding:5px 7px;white-space:nowrap}
</style>
<style id="ttt-master-global-style">
#ttt-master-global{position:fixed;right:18px;bottom:18px;z-index:99990;display:flex;align-items:center;gap:9px;background:#071b2e;border:1px solid #3a91ad;border-radius:12px;padding:10px 12px;box-shadow:0 0 22px #00dfff44;color:#e8faff;font:700 13px system-ui,sans-serif}
#ttt-master-global.active{border-color:#39ff14;box-shadow:0 0 20px #39ff1455}
#ttt-master-global button{cursor:pointer;border:1px solid #39ff14;border-radius:7px;background:#173c2c;color:#baffc0;padding:9px;font-weight:800}

</style>
</head>
<body>

<header class="toolbar toolbar-compact">
  <div class="toolbar-main">
    <div class="left">
      <button class="btn btn-amber" id="btn-volver">← Volver</button>
      <button class="btn btn-blue" id="btn-refrescar">Refrescar datos</button>
      <button class="btn btn-gray" id="btn-export">Exportar resultados</button>
      <button class="btn btn-master" id="btn-master" type="button" aria-pressed="false">MASTER</button>
      <span id="master-status" aria-live="polite"></span>
    </div>
    <div class="toolbar-center">
      <h2 id="title">START GAMES</h2>
    </div>
    <div class="right">
      <div class="toolbar-stats">
        <div class="badge" id="count">Competidores: 0</div>
        <div class="badge" id="peso-range">Peso: —</div>
        <span class="visually-hidden" id="estado-persist" aria-live="polite">Sin guardar</span>
      </div>
      <span class="badge" id="area-info">Área</span>
      <input id="filtro" type="search" placeholder="Filtrar por nombre…" />
    </div>
  </div>
</header>

<section class="judges-strip" aria-label="Nombres de los jueces">
  <div class="judge-name-card" style="--judge-color:#39ff14"><label for="nombre-juez-1">JUEZ 1</label><input id="nombre-juez-1" type="text" placeholder="Nombre del juez" autocomplete="off" maxlength="80"></div>
  <div class="judge-name-card" style="--judge-color:#ffff00"><label for="nombre-juez-2">JUEZ 2</label><input id="nombre-juez-2" type="text" placeholder="Nombre del juez" autocomplete="off" maxlength="80"></div>
  <div class="judge-name-card" style="--judge-color:#ff00ff"><label for="nombre-juez-3">JUEZ 3</label><input id="nombre-juez-3" type="text" placeholder="Nombre del juez" autocomplete="off" maxlength="80"></div>
  <div class="judge-name-card" style="--judge-color:#ff8c00"><label for="nombre-juez-4">JUEZ 4</label><input id="nombre-juez-4" type="text" placeholder="Nombre del juez" autocomplete="off" maxlength="80"></div>
</section>

<div class="games-scroll"><table id="games-table">
  <thead>
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th colspan="3">Salto</th>
      <th colspan="3">Rotura</th>
      <th colspan="2">Lucha</th>
      <th colspan="3">Combate</th>
    </tr>
    <tr>
      <th></th><th></th>
      <th>Altura a saltar</th><th>Acción</th><th>Puntaje</th>
      <th>Puntaje de Rotura</th><th>Acción</th><th>Puntaje</th>
      <th>Acción</th><th>Puntaje</th>
      <th>Acción</th><th>Puntaje</th><th>Tiempo de Finalización</th>
    </tr>
  </thead>
  <tbody id="games-tbody"></tbody>
</table></div>

<div class="master-modal" id="master-modal" hidden>
  <div class="master-dialog" role="dialog" aria-modal="true" aria-labelledby="master-modal-title">
    <h3 id="master-modal-title">ACCESO MASTER</h3>
    <p>Ingresá la contraseña para habilitar la edición de los datos.</p>
    <form id="master-form">
      <input id="master-password" type="password" placeholder="Contraseña" autocomplete="off" required>
      <div class="master-error" id="master-error" role="alert"></div>
      <div class="master-actions">
        <button type="button" class="btn btn-gray" id="master-cancelar">Cancelar</button>
        <button type="button" class="btn btn-green" id="master-ingresar">Ingresar</button>
      </div>
    </form>
  </div>
</div>
<script>
(function(){
  const STORAGE_KEY = "ct_acreditaciones_v1";
  const params = new URLSearchParams(location.search);
  const AREA = params.get("area") || "";

  const STATE_KEY = (a)=>`ct_games_state_v1_${a||'?'}`;
  const RESULT_SYNC_KEY = (a)=>`ct_results_sync_v1_${a||'?'}`;
  const PAGES = { rotura: "rotura.html", lucha: "lucha al punto.html", combate: "Combate Total.html" };


  // Nombres de jueces guardados por área, sin alterar los resultados de competición.
  const JUDGES_KEY = (a)=>`ct_jueces_nombres_v1_${a||'?'}`;
  let nombresJueces = [];
  try { const saved = JSON.parse(localStorage.getItem(JUDGES_KEY(AREA)) || '[]'); if(Array.isArray(saved)) nombresJueces = saved; } catch(e) { console.warn('No se pudieron leer los jueces',e); }
  for(let i=1;i<=4;i++){
    const campo = document.getElementById(`nombre-juez-${i}`);
    campo.value = (nombresJueces[i-1] || '').toLocaleUpperCase('es-AR');
    campo.addEventListener('input',()=>{
      const inicio = campo.selectionStart, fin = campo.selectionEnd;
      campo.value = campo.value.toLocaleUpperCase('es-AR');
      try { campo.setSelectionRange(inicio, fin); } catch(e) {}
      nombresJueces[i-1] = campo.value;
      try { localStorage.setItem(JUDGES_KEY(AREA),JSON.stringify(nombresJueces)); } catch(e) { console.warn('No se pudieron guardar los jueces',e); }
    });
  }

  // Mantener fija la segunda fila completa justo debajo de las disciplinas.
  const filaDisciplinas = document.querySelector('#games-table thead tr:first-child');
  const actualizarAltoDisciplinas = () => {
    if (filaDisciplinas) document.documentElement.style.setProperty('--alto-disciplinas', `${filaDisciplinas.getBoundingClientRect().height}px`);
  };
  actualizarAltoDisciplinas();
  if (window.ResizeObserver && filaDisciplinas) new ResizeObserver(actualizarAltoDisciplinas).observe(filaDisciplinas);
  window.addEventListener('resize', actualizarAltoDisciplinas);

  const el = (id)=>document.getElementById(id);
  const gamesState = {};
  let masterActivo = localStorage.getItem("ct_master_mode_v1")==="true";
  // La contraseña en un HTML local es una barrera de interfaz, NO autenticación segura.
  const MASTER_PASSWORD = 'hideandseek4dmansion';
  const escapeHtml = (v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const masterInput = (campo, valor, id, tipo='text', extra='') =>
    `<input class="master-field ${campo==='id'?'master-id':''}" data-master-field="${campo}" data-comp-id="${escapeHtml(id)}" type="${tipo}" value="${escapeHtml(valor)}" ${extra}>`;
  function guardarCompetidores(arr){localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));}
  function registroMaster(id, campo, anterior, nuevo){
    try {const key='ct_master_audit_v1';const log=JSON.parse(localStorage.getItem(key)||'[]');
      log.push({fecha:new Date().toISOString(),area:AREA,id:String(id),campo,anterior,nuevo});
      localStorage.setItem(key,JSON.stringify(log));
    } catch(e){console.warn('No se pudo registrar auditoría Master',e);}
  }
  function activarMaster(activar){
    masterActivo=activar;
    localStorage.setItem("ct_master_mode_v1",String(activar));
    document.body.classList.toggle('master-active',activar);
    const btn=el('btn-master');btn.classList.toggle('active',activar);
    btn.textContent=activar?'DESACTIVAR MASTER':'MASTER';btn.setAttribute('aria-pressed',String(activar));
    el('master-status').textContent=activar?'MODO MASTER ACTIVO':'';
    render();
    window.dispatchEvent(new Event('ttt-master-ui-refresh'));
  }
  function editarMaster(id,campo,valor){
    if(!masterActivo)return;
    const arr=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    const c=arr.find(x=>String(x.id)===String(id)&&String(x.area)===String(AREA));
    if(!c)return;
    const st=getCompState(id);
    const camposResultado=['saltoPuntaje','roturaPuntaje','luchaPuntaje','combatePuntaje','combateTiempoFin'];
    const camposNumericos=['hds','altura','peso','pdr','saltoPuntaje','roturaPuntaje','luchaPuntaje','combatePuntaje'];
    if(campo==='id'){
      const nuevoId=Number(valor);
      if(!Number.isSafeInteger(nuevoId)||nuevoId<1){alert('El ID debe ser un entero positivo.');return render();}
      if(arr.some(x=>String(x.id)===String(nuevoId)&&String(x.id)!==String(id))){alert('Ese ID ya está en uso.');return render();}
      const anterior=c.id;c.id=nuevoId;
      if(gamesState[id]){gamesState[nuevoId]={...gamesState[id]};delete gamesState[id];}
      try{const key=RESULT_SYNC_KEY(AREA);const sync=JSON.parse(localStorage.getItem(key)||'{}');
        if(sync[id]){sync[nuevoId]={...sync[id]};delete sync[id];localStorage.setItem(key,JSON.stringify(sync));}}
      catch(e){console.error(e)}
      guardarCompetidores(arr);saveState();registroMaster(id,campo,anterior,nuevoId);return render();
    }
    if(campo==='area'){
      const nuevo=String(valor).trim();if(!nuevo){alert('El área no puede quedar vacía.');return render();}
      const anterior=c.area;c.area=nuevo;guardarCompetidores(arr);
      registroMaster(id,campo,anterior,nuevo);return render();
    }
    if(campo==='saltoLogrado'){
      const anterior=!!st.saltoLogrado;st.saltoLogrado=valor==='true';
      if(!st.saltoLogrado)st.saltoPuntaje=0;
      saveState();mergeResultados(AREA,{[id]:{saltoLogrado:st.saltoLogrado,saltoPuntaje:st.saltoPuntaje,saltoAltura:st.saltoLogrado?Number(c.hds||0):0}});
      registroMaster(id,campo,anterior,st.saltoLogrado);return render();
    }
    if(camposResultado.includes(campo)){
      let nuevo=valor;
      if(campo!=='combateTiempoFin'){
        if(String(valor).trim()===''){nuevo=0;}else{nuevo=Number(String(valor).replace(',','.'));}
        if(!Number.isFinite(nuevo)||nuevo<0){alert('Ingresá un puntaje válido (0 o mayor).');return render();}
      }
      const anterior=st[campo];st[campo]=nuevo;
      const parcial={[campo]:nuevo};
      if(campo==='saltoPuntaje'){
        st.saltoLogrado=nuevo>0;parcial.saltoLogrado=st.saltoLogrado;
        parcial.saltoAltura=st.saltoLogrado?Number(c.hds||0):0;
      }
      saveState();mergeResultados(AREA,{[id]:parcial});registroMaster(id,campo,anterior,nuevo);return render();
    }
    if(!['nombre','hds','altura','peso','pdr'].includes(campo))return;
    let nuevo=valor;
    if(camposNumericos.includes(campo)){
      nuevo=Number(String(valor).replace(',','.'));
      if(!Number.isFinite(nuevo)||(campo==='altura'&&nuevo<=0)||(campo!=='altura'&&nuevo<0)){
        alert('Ingresá un número válido.');return render();}
    } else {nuevo=String(valor).trim();if(!nuevo){alert('El nombre no puede estar vacío.');return render();}}
    const anterior=c[campo];c[campo]=nuevo;guardarCompetidores(arr);
    if((campo==='hds'||campo==='altura')&&st.saltoLogrado){
      st.saltoPuntaje=Number(c.hds||0)/Number(c.altura||1)*10;
      saveState();mergeResultados(AREA,{[id]:{saltoPuntaje:st.saltoPuntaje,saltoAltura:Number(c.hds||0),saltoLogrado:true}});
    }
    registroMaster(id,campo,anterior,nuevo);render();
  }
  const modalMaster=el('master-modal');
  const claveMaster=el('master-password');
  const errorMaster=el('master-error');
  function cerrarModalMaster(){modalMaster.hidden=true;claveMaster.value='';errorMaster.textContent='';}
  el('btn-master').addEventListener('click',()=>{
    if(masterActivo){activarMaster(false);return;}
    errorMaster.textContent='';claveMaster.value='';modalMaster.hidden=false;
    claveMaster.focus();
  });
  el('master-cancelar').addEventListener('click',cerrarModalMaster);
  modalMaster.addEventListener('click',e=>{if(e.target===modalMaster)cerrarModalMaster();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalMaster.hidden)cerrarModalMaster();});
  function comprobarClaveMaster(){
    const clave=claveMaster.value;
    if(clave!==MASTER_PASSWORD){
      errorMaster.textContent='Contraseña incorrecta. Verificá los caracteres e intentá nuevamente.';
      claveMaster.focus();claveMaster.select();return;
    }
    try{
      activarMaster(true);
      cerrarModalMaster();
    }catch(err){
      console.error('Error al activar Modo Master:',err);
      errorMaster.textContent='No se pudo activar el modo Master: '+err.message;
    }
  }
  el('master-ingresar').addEventListener('click',comprobarClaveMaster);
  el('master-form').addEventListener('submit',e=>{e.preventDefault();comprobarClaveMaster();});
  el('games-tbody').addEventListener('change',e=>{
    const input=e.target.closest('[data-master-field]');if(!input||!masterActivo)return;
    editarMaster(input.dataset.compId,input.dataset.masterField,input.value);
  });



// Merge hacia el storage de resultados que usa el Ranking
function mergeResultados(area, updatesById) {
  try {
    const key = RESULT_SYNC_KEY(area);
    const raw = localStorage.getItem(key);
    const prev = raw ? JSON.parse(raw) : {};
    const merged = { ...prev };

    for (const [id, parcial] of Object.entries(updatesById)) {
      const anterior = prev[id] || {};
      merged[id] = { ...anterior, ...parcial };  // no pisa rotura/lucha/combate
    }

    localStorage.setItem(key, JSON.stringify(merged));

    // avisar a otras pestañas (Ranking)
    try {
      window.dispatchEvent(
        new StorageEvent("storage", { key, newValue: JSON.stringify(merged) })
      );
    } catch (_) {}
  } catch (e) {
    console.error("mergeResultados error", e);
  }
}



  function markPersisted(ok){
    const pill = el('estado-persist'); if(!pill) return;
    if(ok){ pill.textContent = 'Guardado'; pill.style.color = '#aef0b0'; pill.style.borderColor = '#2f5'; }
    else { pill.textContent = 'Sin guardar'; pill.style.color = '#faa'; pill.style.borderColor = '#f55'; }
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STATE_KEY(AREA));
      const obj = raw? JSON.parse(raw) : {};
      Object.assign(gamesState, obj);
      markPersisted(true);
    }catch(e){ console.error(e); markPersisted(false); }
  }
  function saveState(){
    try{
      localStorage.setItem(STATE_KEY(AREA), JSON.stringify(gamesState));
      markPersisted(true);
    }catch(e){ console.error(e); markPersisted(false); }
  }
  function getCompState(id){
    if(!gamesState[id]) gamesState[id] = {
      saltoLogrado:false, saltoPuntaje:0,
      roturaIniciada:false, roturaPuntaje:0,
      luchaPuntaje:0,
      combatePuntaje:0, combateTiempoFin:""
    };
    return gamesState[id];
  }

  function leerCompetidores(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const arr = JSON.parse(raw) || [];
      return arr.filter(c=>c.acreditado && String(c.area)===String(AREA));
    }catch(e){ console.error(e); return []; }
  }

  // Parsing robusto de pesos para el rango
  function parsePeso(val){
    if(val==null) return NaN;
    const s = String(val).replace(',', '.');               // 70,5 -> 70.5
    const m = s.match(/[0-9]+(?:\\.[0-9]+)?/);             // toma 70 / 70.5
    return m ? Number(m[0]) : NaN;
  }

  // Merge de resultados que vengan de otras vistas
  function mergeResultadosExternos(){
    try{
      const raw = localStorage.getItem(RESULT_SYNC_KEY(AREA));
      if(!raw) return;
      const obj = JSON.parse(raw) || {};
      Object.entries(obj).forEach(([id, up])=>{
        Object.assign(getCompState(id), up);
      });
      saveState();
    }catch(e){ console.error('merge ext', e); }
  }

  // Mantener los valores reales en el estado; solo cambia la presentación.
  function pintarPuntaje(celda, valor){
    if(!celda) return;
    const numero = Number(valor) || 0;
    const tieneResultado = Number.isFinite(numero) && numero !== 0;
    celda.textContent = tieneResultado ? numero.toFixed(3) : '—';
    celda.classList.toggle('score-result', tieneResultado);
    celda.classList.toggle('score-pending', !tieneResultado);
  }

  // Enfrentamientos extraordinarios: se guardan dentro del estado del área,
  // por lo que el reinicio general existente también los elimina.
  function extras(){return gamesState.__extras || (gamesState.__extras={});}
  function reconcileExtra(){
    const syncKey=RESULT_SYNC_KEY(AREA);
    let sync={};try{sync=JSON.parse(localStorage.getItem(syncKey)||'{}');}catch(e){return;}
    let changed=false;
    for(const [disc,ex] of Object.entries(extras())){
      if(!ex || !ex.pending)continue;
      const field=disc==='lucha'?'luchaPuntaje':'combatePuntaje';
      const a=String(ex.a),b=String(ex.b);
      const oldA=Number(ex.beforeA?.score||0),oldB=Number(ex.beforeB?.score||0);
      const newA=Number(sync[a]?.[field]??oldA),newB=Number(sync[b]?.[field]??oldB);
      // Si todavía no hay resultados distintos, no se considera terminada la pelea.
      if(newA===oldA && newB===oldB)continue;
      for(const [id,oldScore,oldTime,newScore] of [[a,oldA,ex.beforeA?.time,newA],[b,oldB,ex.beforeB?.time,newB]]){
        const best=Math.max(oldScore,newScore);
        const st=getCompState(id);
        st[field]=best;
        sync[id]={...(sync[id]||{}),[field]:best};
        if(disc==='combate'){
          const bestTime=newScore>oldScore?sync[id].combateTiempoFin:oldTime;
          st.combateTiempoFin=bestTime??'';
          sync[id].combateTiempoFin=st.combateTiempoFin;
        }
      }
      ex.pending=false;ex.completed=true;ex.scores={a:newA,b:newB};changed=true;
      registroMaster(ex.a,'pelea-extra-'+disc,'pendiente',JSON.stringify(ex.scores));
    }
    if(changed){localStorage.setItem(syncKey,JSON.stringify(sync));saveState();}
  }
  function renderExtras(list){
    const tbody=el('games-tbody');
    const all=leerCompetidores().sort((a,b)=>(parsePeso(a.peso)||0)-(parsePeso(b.peso)||0));
    const odd=all.length%2?all[all.length-1]:null;
    for(const disc of ['lucha','combate']){
      const ex=extras()[disc];
      if(!masterActivo&&!ex)continue;
      const tr=document.createElement('tr');tr.className='extra-match-row';
      const td=document.createElement('td');td.colSpan=13;
      const title=disc==='lucha'?'LUCHA':'COMBATE';
      if(ex){
        const a=all.find(c=>String(c.id)===String(ex.a));
        const b=all.find(c=>String(c.id)===String(ex.b));
        const status=ex.pending?'EN CURSO / PENDIENTE DE RESULTADO':ex.completed?'RESULTADO PROCESADO':'PREPARADO';
        td.innerHTML=`<div class="extra-match-inner"><strong>EXTRA ${title}</strong><span>${escapeHtml(a?.nombre||ex.a)} VS ${escapeHtml(b?.nombre||ex.b)}</span><span class="hint">${status}</span>${masterActivo?`<button class="btn btn-blue" data-action="extra-start" data-disc="${disc}" ${ex.pending?'disabled':''}>INICIAR ${title}</button>${ex.pending?`<button class="btn btn-gray" data-action="extra-unchanged" data-disc="${disc}">FINALIZAR SIN CAMBIOS</button>`:''}<button class="btn btn-red" data-action="extra-remove" data-disc="${disc}">QUITAR</button>`:''}</div>`;
      }else if(masterActivo&&odd){
        const options=all.filter(c=>String(c.id)!==String(odd.id)).map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.nombre)} · ID ${escapeHtml(c.id)}</option>`).join('');
        td.innerHTML=`<div class="extra-match-inner"><strong>EXTRA ${title}</strong><span>Sin pareja: ${escapeHtml(odd.nombre)}</span><label>Rival acreditado: <select data-extra-select="${disc}"><option value="">Seleccionar...</option>${options}</select></label><button class="btn btn-green" data-action="extra-add" data-disc="${disc}">AGREGAR ENFRENTAMIENTO</button></div>`;
      }else continue;
      tr.appendChild(td);tbody.appendChild(tr);
    }
  }

  function render(){
    reconcileExtra();
    mergeResultadosExternos();
    const q = (el('filtro')?.value||'').trim().toLowerCase();

    const list = leerCompetidores()
      .filter(c => !q || String(c.nombre||'').toLowerCase().includes(q))
      .sort((a,b)=>(parsePeso(a.peso)||0)-(parsePeso(b.peso)||0));

    el("title").textContent = "START GAMES";
    el("area-info").textContent = `Área ${AREA||"?"}`;
    el("count").textContent = `Competidores: ${list.length}`;

    const pesos = list.map(c=>parsePeso(c.peso)).filter(n=>Number.isFinite(n));
    el("peso-range").textContent = pesos.length
      ? `Peso: ${Math.min(...pesos).toFixed(0)}–${Math.max(...pesos).toFixed(0)} kg`
      : "Peso: —";

    const tbody = el("games-tbody");
    tbody.innerHTML = "";

    list.forEach((comp, idx)=>{
      const st = getCompState(comp.id);
      const hds = parseFloat(comp.hds) || 0;
      const altura = parseFloat(comp.altura) || 1;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${masterActivo?masterInput('id',comp.id,comp.id,'number','step="1" min="1"'):escapeHtml(comp.id)}</td>
        <td style="text-align:left">${masterActivo?masterInput('nombre',comp.nombre,comp.id):escapeHtml(comp.nombre)}</td>

        <!-- Salto: Acción (Fallo/Logró) y Puntaje -->
        <td>${masterActivo?masterInput('hds',comp.hds??0,comp.id,'number','step="0.001" min="0"'):(hds ? `${hds.toFixed(3)} m` : '<span class="cell-muted">—</span>')}</td>
        <td>
          <button class="btn ${st.saltoLogrado?'btn-green':'btn-red'}"
                  data-action="toggle-salto" data-id="${comp.id}">
            ${st.saltoLogrado ? 'Logró' : 'Fallo'}
          </button>
        </td>
        <td id="salto-score-${comp.id}">${Number(st.saltoLogrado ? st.saltoPuntaje : 0).toFixed(3)}</td>

        <!-- Rotura (3 columnas: Puntaje de Rotura, Acción, Puntaje) -->
        <td>${masterActivo?masterInput('pdr',comp.pdr??0,comp.id,'number','step="any" min="0"'):escapeHtml(comp.pdr??'—')}</td>
        <td><button class="btn btn-amber" data-action="iniciar-rotura" data-id="${comp.id}">Iniciar Rotura</button></td>
        <td id="rotura-score-${comp.id}">${Number(st.roturaPuntaje||0).toFixed(3)}</td>
      `;

      // Lucha: Acción (rowSpan por pareja) + Puntaje (por fila)
      if(idx % 2 === 0){
        const parejaSize = (idx+1 < list.length) ? 2 : 1;
        const A = list[idx];
        const B = list[idx+1];
        const luchaTd = document.createElement("td");
        luchaTd.rowSpan = parejaSize;
        const disabled = !B; // si no hay contrincante, se deshabilita
        luchaTd.innerHTML = `<button class="btn ${disabled?'btn-gray':'btn-blue'}" ${disabled?'disabled':''}
                              data-action="iniciar-lucha" data-a="${A?.id??''}" data-b="${B?.id??''}">
                              Iniciar Lucha</button>`;
        tr.appendChild(luchaTd);
      }
      const luchaScore = document.createElement("td");
      luchaScore.id = `lucha-score-${comp.id}`;
      luchaScore.textContent = Number(st.luchaPuntaje||0).toFixed(3);
      tr.appendChild(luchaScore);

      // Combate: Acción (rowSpan) + Puntaje + Tiempo de Finalización
      if(idx % 2 === 0){
        const parejaSize = (idx+1 < list.length) ? 2 : 1;
        const A = list[idx];
        const B = list[idx+1];
        const combateTd = document.createElement("td");
        combateTd.rowSpan = parejaSize;
        const disabled = !B;
        combateTd.innerHTML = `<button class="btn ${disabled?'btn-gray':'btn-blue'}" ${disabled?'disabled':''}
                                data-action="iniciar-combate" data-a="${A?.id??''}" data-b="${B?.id??''}">
                                Iniciar Combate</button>`;
        tr.appendChild(combateTd);
      }
      const combateScore = document.createElement("td");
      combateScore.id = `combate-score-${comp.id}`;
      combateScore.textContent = Number(st.combatePuntaje||0).toFixed(3);
      tr.appendChild(combateScore);

      const combateTime = document.createElement("td");
      combateTime.id = `combate-tiempo-${comp.id}`;
      combateTime.innerHTML = st.combateTiempoFin ? `<span>${st.combateTiempoFin}</span>` : '<span class="cell-muted">—</span>';
      tr.appendChild(combateTime);
      if(masterActivo){
        const scoreCampos=[['salto-score-','saltoPuntaje'],['rotura-score-','roturaPuntaje'],['lucha-score-','luchaPuntaje'],['combate-score-','combatePuntaje']];
        for(const [pref,campo] of scoreCampos){
          const celda=tr.querySelector(`[id="${pref}${comp.id}"]`);
          if(celda)celda.innerHTML=masterInput(campo,st[campo]??0,comp.id,'number','step="0.001" min="0"');
        }
        combateTime.innerHTML=masterInput('combateTiempoFin',st.combateTiempoFin??'',comp.id);
      }

      // Marcar límites de disciplinas por celda real (rowSpan no altera la asignación).
      if(!masterActivo){
        pintarPuntaje(tr.querySelector(`[id="salto-score-${comp.id}"]`), st.saltoLogrado ? st.saltoPuntaje : 0);
        pintarPuntaje(tr.querySelector(`[id="rotura-score-${comp.id}"]`), st.roturaPuntaje);
        pintarPuntaje(luchaScore, st.luchaPuntaje);
        pintarPuntaje(combateScore, st.combatePuntaje);
      }

      // Las primeras 8 celdas son ID, nombre, salto x3 y rotura x3.
      // Las restantes se agregan en orden: lucha (acción opcional), puntaje,
      // combate (acción opcional), puntaje y tiempo.
      const base = tr.cells;
      for(let c=2;c<=4;c++) base[c].classList.add('disc-salto');
      base[2].classList.add('disc-start'); base[4].classList.add('disc-end');
      for(let c=5;c<=7;c++) base[c].classList.add('disc-rotura');
      base[5].classList.add('disc-start'); base[7].classList.add('disc-end');
      const luchaInicio = 8;
      const luchaFin = luchaInicio + (idx % 2 === 0 ? 1 : 0);
      for(let c=luchaInicio;c<=luchaFin;c++) base[c].classList.add('disc-lucha');
      base[luchaInicio].classList.add('disc-start'); base[luchaFin].classList.add('disc-end');
      const combateInicio = luchaFin+1;
      const combateFin = base.length-1;
      for(let c=combateInicio;c<=combateFin;c++) base[c].classList.add('disc-combate');
      base[combateInicio].classList.add('disc-start'); base[combateFin].classList.add('disc-end');
      tbody.appendChild(tr);
    });
    renderExtras(list);
  }

  // Eventos
  el("games-tbody").addEventListener("click",(e)=>{
    const btn = e.target.closest("button[data-action]"); if(!btn) return;
    const action = btn.dataset.action;
    if(action==='extra-add' || action==='extra-start' || action==='extra-remove' || action==='extra-unchanged'){
      if(!masterActivo){alert('Activá Master Mode para administrar enfrentamientos extraordinarios.');return;}
      const disc=btn.dataset.disc;
      if(!['lucha','combate'].includes(disc))return;
      const all=leerCompetidores().sort((a,b)=>(parsePeso(a.peso)||0)-(parsePeso(b.peso)||0));
      if(action==='extra-add'){
        const odd=all.length%2?all[all.length-1]:null;
        const select=el('games-tbody').querySelector(`[data-extra-select="${disc}"]`);
        const b=select?.value;
        if(!odd||!b||!all.some(c=>String(c.id)===b&&String(c.id)!==String(odd.id))){alert('Seleccioná un rival acreditado válido.');return;}
        extras()[disc]={a:String(odd.id),b:String(b),pending:false,completed:false};
        saveState();registroMaster(odd.id,'extra-'+disc,'',b);render();return;
      }
      const ex=extras()[disc];if(!ex)return;
      if(action==='extra-unchanged'){
        if(!ex.pending)return;
        if(!confirm('¿Confirmás que la pelea terminó sin cambios de puntuación?'))return;
        ex.pending=false;ex.completed=true;saveState();render();return;
      }
      if(action==='extra-remove'){
        if(!confirm('¿Quitar este enfrentamiento extraordinario? Los puntajes ya guardados no se modificarán.'))return;
        delete extras()[disc];saveState();render();return;
      }
      if(ex.pending){alert('Ya existe una pelea pendiente de resultado.');return;}
      const field=disc==='lucha'?'luchaPuntaje':'combatePuntaje';
      const getBefore=id=>({score:Number(getCompState(id)[field]||0),time:getCompState(id).combateTiempoFin||''});
      ex.beforeA=getBefore(ex.a);ex.beforeB=getBefore(ex.b);ex.pending=true;ex.completed=false;
      saveState();
      const page=disc==='lucha'?PAGES.lucha:PAGES.combate;
      location.href=`${page}?area=${encodeURIComponent(AREA)}&a=${encodeURIComponent(ex.a)}&b=${encodeURIComponent(ex.b)}&extra=1`;
      return;
    }

    if(action==="toggle-salto"){
      const compId = Number(btn.dataset.id);
      const data = leerCompetidores();
      const comp = data.find(c=>c.id===compId); if(!comp) return;
      const st = getCompState(compId);
      const hds = parseFloat(comp.hds)||0; 
      const altura = parseFloat(comp.altura)||1;

      // Toggle SALTO: arranca en FALLÓ (rojo) -> LOGRÓ (verde) con puntaje
      st.saltoLogrado = !st.saltoLogrado;
      st.saltoPuntaje = st.saltoLogrado && altura>0 ? ((hds/altura)*10) : 0;

      btn.textContent = st.saltoLogrado ? "Logró" : "Fallo";
      btn.classList.toggle("btn-green", st.saltoLogrado);
      btn.classList.toggle("btn-red", !st.saltoLogrado);

      const scoreEl = el(`salto-score-${compId}`);
      pintarPuntaje(scoreEl, st.saltoLogrado ? st.saltoPuntaje : 0);

      // 1) guardamos el estado local de la tabla
      saveState();

      // 2) sincronizamos con el storage que usa Ranking
        mergeResultados(AREA, {
          [compId]: {
            saltoLogrado: st.saltoLogrado,
            saltoPuntaje: Number(st.saltoPuntaje || 0),
            saltoAltura: st.saltoLogrado ? Number(hds || 0) : 0
          }
        });

      return;
    }


    if(action==="iniciar-rotura"){
      const compId = Number(btn.dataset.id);
      const data = leerCompetidores();
      const comp = data.find(c=>c.id===compId);
      location.href = `${PAGES.rotura}?area=${encodeURIComponent(AREA)}&id=${encodeURIComponent(compId)}&nombre=${encodeURIComponent(comp?.nombre||'')}`;
      return;
    }

    if(action==="iniciar-lucha" || action==="iniciar-combate"){
      const a = Number(btn.dataset.a);
      const b = Number(btn.dataset.b);
      const page = (action === "iniciar-lucha") ? PAGES.lucha : PAGES.combate;
      location.href = `${page}?area=${encodeURIComponent(AREA)}&a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`;
      return;
    }
  });

  // Topbar
  document.getElementById("btn-volver").addEventListener("click", ()=> history.length>1 ? history.back() : window.close());
  document.getElementById("btn-refrescar").addEventListener("click", render);
  document.getElementById("filtro").addEventListener("input", render);

  // Export CSV
  document.getElementById("btn-export").addEventListener("click", ()=>{
    const list = leerCompetidores().sort((a,b)=>(parsePeso(a.peso)||0)-(parsePeso(b.peso)||0));
    let csv = 'ID,Nombre,Área,SaltoLogrado,SaltoPuntaje,RoturaPuntaje,LuchaPuntaje,CombatePuntaje,CombateTiempoFin\\n';
    list.forEach(c=>{
      const st = getCompState(c.id);
      csv += [
        c.id,
        '"'+(c.nombre||'')+'"',
        AREA,
        st.saltoLogrado?1:0,
        (st.saltoPuntaje||0).toFixed(3),
        (st.roturaPuntaje||0).toFixed(3),
        (st.luchaPuntaje||0).toFixed(3),
        (st.combatePuntaje||0).toFixed(3),
        '"'+(st.combateTiempoFin||'')+'"'
      ].join(',') + '\\n';
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `area-${AREA}-results.csv`; a.style.display='none';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  });

  // Sync live
  window.addEventListener('storage', (ev)=>{
    if(ev.key === RESULT_SYNC_KEY(AREA)){
      mergeResultadosExternos();
      render();
    }
  });

  if(!AREA){ alert("Falta ?area=N en la URL."); }
  loadState();
  activarMaster(masterActivo);
  window.addEventListener("ttt-master-change", e=>{if(masterActivo!==e.detail.active)activarMaster(e.detail.active);});
  window.addEventListener("storage", e=>{if(e.key==="ct_master_mode_v1" && masterActivo!==(e.newValue==="true"))activarMaster(e.newValue==="true");});
})();
</script>

<script id="ttt-master-global-script">
(function(){
  'use strict';
  const KEY='ct_master_mode_v1';
  const box=document.createElement('div');box.id='ttt-master-global';
  box.innerHTML='<span class="ttt-master-dot"></span><span id="ttt-master-global-label">MASTER INACTIVO</span><button type="button" id="ttt-master-global-toggle">ACTIVAR</button>';
  document.body.appendChild(box);
  function active(){return localStorage.getItem(KEY)==='true';}
  function sync(){const on=active();box.classList.toggle('active',on);document.getElementById('ttt-master-global-label').textContent=on?'MASTER ACTIVO':'MASTER INACTIVO';document.getElementById('ttt-master-global-toggle').textContent=on?'DESACTIVAR':'ACTIVAR';document.body.classList.toggle('ttt-master-global-active',on);window.dispatchEvent(new CustomEvent('ttt-master-change',{detail:{active:on}}));}
  document.getElementById('ttt-master-global-toggle').addEventListener('click',()=>{
    // Reutiliza el formulario seguro visualmente (input type=password) de Start Games.
    // Así no se muestran los caracteres como sucede con window.prompt().
    document.getElementById('btn-master').click();
  });
  window.addEventListener('ttt-master-ui-refresh',sync);
  window.addEventListener('storage',e=>{if(e.key===KEY)sync();});
  sync();
})();
</script></body>
</html>
