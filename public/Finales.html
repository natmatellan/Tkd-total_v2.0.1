<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finales · TaeKwon-Do Total</title><style>
:root{color-scheme:dark;--cyan:#36e9ff;--green:#39ff14;--yellow:#ffe16c;--red:#ff476d;--blue:#559bff;--bg:#06101f;--panel:#0b1e34}*{box-sizing:border-box}body{margin:0;color:#eaf7ff;font-family:system-ui,Arial,sans-serif;background:radial-gradient(ellipse at 50% -20%,#154466 0%,#071629 50%,#030b17 100%);min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#3fe9ff16 1px,transparent 1px),linear-gradient(90deg,#3fe9ff16 1px,transparent 1px);background-size:43px 43px;mask-image:linear-gradient(#000b,#0002 90%)}body:after{content:"";position:fixed;left:-30%;right:-30%;bottom:-40%;height:65%;transform:perspective(400px) rotateX(65deg);transform-origin:bottom;background-image:linear-gradient(#2ee8ff24 1px,transparent 1px),linear-gradient(90deg,#2ee8ff24 1px,transparent 1px);background-size:70px 70px;pointer-events:none}header,main{position:relative;z-index:1}header{padding:19px 3vw;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid #3cdfff65;background:#07172bd9;box-shadow:0 8px 30px #0005}h1{margin:0;font-size:clamp(1.6rem,3vw,2.8rem);letter-spacing:.15em;text-shadow:0 0 20px #28dfff77}.eyebrow{color:#79b8d0;font-size:.7rem;letter-spacing:.2em;font-weight:800}.actions,.tabs,.subtabs,.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}button{border:1px solid #3a8cad;background:#0e2a42;color:#e9fbff;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:800;transition:.15s}button:hover{border-color:var(--cyan);box-shadow:0 0 15px #22dfff55}button:disabled{opacity:.35;cursor:not-allowed}button.active{background:#14506a;border-color:var(--cyan);box-shadow:inset 0 0 16px #36e9ff33,0 0 15px #36e9ff33}.danger{border-color:#aa3950;color:#ffb8c5}.ok{border-color:#2f9d62;color:#a6ffd3}.small{padding:5px 8px;font-size:.8rem}main{padding:22px 3vw 70px;max-width:1600px;margin:auto}.tabs{margin:0 0 17px}.tabs button{flex:1;min-width:155px;padding:15px 8px;font-size:1rem}.tabs button[data-tab="salto"]{--accent:var(--yellow)}.tabs button[data-tab="rotura"]{--accent:var(--green)}.tabs button[data-tab="lucha"]{--accent:var(--blue)}.tabs button[data-tab="combate"]{--accent:var(--red)}.tabs button.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 25%,transparent)}.panel{background:#081c32e8;border:1px solid #337594;border-radius:13px;padding:17px;box-shadow:0 0 26px #2ddfff18,inset 0 0 30px #36e9ff09;margin-bottom:17px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}h2{margin:0;font-size:clamp(1.3rem,2.6vw,2.2rem);letter-spacing:.06em}h3{margin:0 0 12px;font-size:1.1rem;color:#b6edff}.hint{font-size:.81rem;color:#9cbcd1}.pill{display:inline-block;border:1px solid #3e8ca9;padding:6px 10px;border-radius:999px;color:#9feeff;font-weight:800;font-size:.8rem}.subtabs{margin-bottom:16px}.subtabs button.active{border-color:var(--red);color:#ffc2cf}.table-wrap{overflow-x:auto;border:1px solid #294b69;border-radius:9px}table{border-collapse:collapse;width:100%;min-width:750px}th{background:#102b46;color:#8ee9ff;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:12px;white-space:nowrap}td{padding:11px 12px;border-top:1px solid #24435e;background:#091b2e}tr:nth-child(even) td{background:#0d2339}td.num{font-weight:900;color:#85eaff;font-variant-numeric:tabular-nums}.name{font-weight:800}input,select{background:#071629;border:1px solid #3c6685;border-radius:7px;color:white;padding:8px;min-width:0}input[type=number]{width:86px}input[type=text]{width:145px}select{max-width:100%}input:focus,select:focus{outline:1px solid var(--cyan)}.muted{color:#8ba9bf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:13px}.match{border:1px solid #2c6688;background:linear-gradient(135deg,#102b46,#081a30);border-radius:12px;padding:13px;box-shadow:inset 0 0 18px #28dfff09}.match .tag{font-size:.72rem;letter-spacing:.15em;color:#79cbe7;font-weight:900;margin-bottom:9px}.fighter{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px;border:1px solid #2c4961;border-radius:8px;margin:5px 0;background:#091b2d}.fighter.win{border-color:var(--green);background:#123e2c;box-shadow:0 0 10px #39ff1433}.fighter span{overflow-wrap:anywhere}.fighter strong{color:#77e7ff;white-space:nowrap}.match select{width:100%;margin:8px 0}.match .controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.match .controls input{width:100%;flex:1}.match button{width:100%;margin-top:8px}.round-title{color:#fff;border-left:4px solid var(--cyan);padding:7px 12px;background:#14334d;margin:22px 0 12px}.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.medal{border-radius:12px;padding:15px;background:#f2faff;color:#10253b;text-align:center;box-shadow:0 0 18px #e9f9ff70}.medal:nth-child(1){border:3px solid #f5cb45}.medal:nth-child(2){border:3px solid #b7c8d5}.medal:nth-child(3){border:3px solid #bd8c69}.medal .symbol{font-size:1.8rem}.medal strong{display:block;overflow-wrap:anywhere}.status{font-size:.78rem;color:#9bc6da}.notice{border-left:4px solid var(--yellow);padding:12px;background:#332c163b;color:#ffeba4;margin-bottom:15px}.success{border-left-color:var(--green);background:#12351d55;color:#aaffbd}.empty{padding:45px;text-align:center;color:#8db2c9}.footer{color:#7d9ab0;text-align:center;font-size:.75rem;margin-top:30px}@media(max-width:650px){.tabs button{min-width:125px}.medals{grid-template-columns:1fr}header{padding:15px}main{padding:15px 10px 50px}.panel{padding:12px}}

/* Salto: indicadores protagonistas y registro de participantes por ronda */
.jump-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:17px}
.jump-metric{position:relative;overflow:hidden;text-align:center;padding:22px 12px 20px;border:2px solid #e6c755;border-radius:15px;background:linear-gradient(155deg,#27304a,#101e34 70%);box-shadow:0 0 24px #ffe16c30,inset 0 0 24px #ffe16c0b}
.jump-metric:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,#ffffff0e 50%,transparent 75%);pointer-events:none}
.jump-metric .metric-label{display:block;color:#d3e2f2;font-size:clamp(.78rem,1.1vw,1rem);font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.jump-metric .metric-value{display:block;color:#fff3b2;font-size:clamp(2.5rem,5vw,5.3rem);font-weight:1000;line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums;text-shadow:0 0 18px #ffe16c80}
.jump-metric.current{border-color:#39ff14;box-shadow:0 0 32px #39ff1440,inset 0 0 22px #39ff1418}
.jump-metric.current .metric-value{color:#baffab;text-shadow:0 0 22px #39ff1488}
.jump-metric.round{border-color:#36e9ff;box-shadow:0 0 26px #36e9ff38}
.jump-metric.round .metric-value{color:#b7f7ff;text-shadow:0 0 20px #36e9ff80}
.jump-history{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.jump-history-card{border:1px solid #376f8b;background:linear-gradient(135deg,#0e2a43,#08192e);padding:14px;border-radius:11px}
.jump-history-card.active{border-color:#39ff14;box-shadow:0 0 18px #39ff1426}
.jump-history-card strong{color:#fff0a4;font-size:1.1rem}.jump-history-card .jump-entrant{padding:6px 0;border-bottom:1px solid #ffffff15;font-size:.86rem}
.jump-history-card .jump-entrant:last-child{border:0}.jump-history-card .jump-entrant span{color:#9cbcd1}
@media(max-width:650px){.jump-metrics{grid-template-columns:1fr;gap:9px}.jump-metric{padding:12px}.jump-metric .metric-value{font-size:2.6rem}}

.jump-height-control{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.jump-height-control input{width:125px;font-size:1.25rem;font-weight:900;color:var(--yellow)}.jump-rank-table th:first-child,.jump-rank-table td:first-child{font-size:1.2rem;font-weight:900;color:var(--yellow)}.jump-rank-table .medal-row td{border-left:3px solid var(--yellow)}
.jump-rank-table tr.podium-rank td{background:#f8fbff!important;color:#18283c!important;border-top:2px solid #dce7f2;font-weight:800}.jump-rank-table tr.podium-rank td.num{color:#18283c!important}.jump-rank-table tr.podium-1 td:first-child{border-left:8px solid #d4a617;color:#a17800!important}.jump-rank-table tr.podium-2 td:first-child{border-left:8px solid #9ba9bb;color:#637487!important}.jump-rank-table tr.podium-3 td:first-child{border-left:8px solid #b87942;color:#99552d!important}.jump-rank-table tr.podium-1 td{box-shadow:inset 0 1px #f5d87a}.jump-rank-table tr.podium-2 td{box-shadow:inset 0 1px #c4d0dc}.jump-rank-table tr.podium-3 td{box-shadow:inset 0 1px #d7ad8d}

/* Podio: acabado de medallas con relieve, reflejos y profundidad */
.jump-rank-table{border-collapse:separate;border-spacing:0 7px}
.jump-rank-table tr.podium-rank td{position:relative;background:linear-gradient(115deg,#ffffff 0%,#f4f8fc 34%,#e7edf4 56%,#ffffff 78%,#edf2f7 100%)!important;border-top:1px solid #ffffff!important;border-bottom:2px solid #bac9d7!important;box-shadow:inset 0 2px 1px #ffffff, inset 0 -2px 3px #a3b2c044,0 5px 10px #0005!important;text-shadow:0 1px 0 #fff}
.jump-rank-table tr.podium-rank td:first-child{border-radius:11px 0 0 11px;border-left-width:9px!important;font-size:1.4rem;white-space:nowrap}
.jump-rank-table tr.podium-rank td:last-child{border-radius:0 11px 11px 0}
.jump-rank-table tr.podium-1 td{border-bottom-color:#bb8b24!important;background:linear-gradient(115deg,#fff 0%,#fff9e8 33%,#e9d39c 55%,#fffdf5 79%,#fff 100%)!important}
.jump-rank-table tr.podium-2 td{border-bottom-color:#8799ab!important;background:linear-gradient(115deg,#fff 0%,#f7faff 33%,#d4dfe9 55%,#fff 79%,#f5f8fc 100%)!important}
.jump-rank-table tr.podium-3 td{border-bottom-color:#a66a3d!important;background:linear-gradient(115deg,#fff 0%,#fff6ee 33%,#e5c3a7 55%,#fffaf6 79%,#fff 100%)!important}
.podium-emblem{display:inline-grid;place-items:center;width:33px;height:33px;margin-right:9px;border-radius:50%;vertical-align:middle;color:#fff;font-size:1.1rem;font-weight:1000;text-shadow:0 1px 2px #0008;box-shadow:inset 0 2px 2px #fff9,inset 0 -3px 4px #0004,0 2px 5px #0005}
.podium-1 .podium-emblem{background:radial-gradient(circle at 30% 20%,#fff2a3,#e7b828 45%,#9c6c08 90%);border:2px solid #c99b23}
.podium-2 .podium-emblem{background:radial-gradient(circle at 30% 20%,#fff,#c0cedb 45%,#718598 90%);border:2px solid #a6b4c3}
.podium-3 .podium-emblem{background:radial-gradient(circle at 30% 20%,#ffdbb4,#c48a58 45%,#7c4526 90%);border:2px solid #ae784d}
.jump-rank-table .podium-rank .name{font-weight:1000;letter-spacing:.025em}

/* Lucha: llave horizontal Neon Grid */
.lucha-bracket{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:30px;align-items:stretch;margin:16px 0 22px;overflow-x:auto;padding:12px 5px 22px}
.lucha-stage{display:flex;flex-direction:column;justify-content:space-around;gap:17px;min-width:240px;position:relative}
.lucha-stage h3{text-align:center;color:#a7bbff;letter-spacing:.14em;font-size:.86rem;margin:0 0 10px}
.lucha-match{border:1px solid #5473b4;border-radius:14px;padding:13px;background:linear-gradient(140deg,#132b4d,#07172e);box-shadow:0 0 18px #346dff20;position:relative}
.lucha-match.decided{border-color:#39ff1488}
.lucha-match-head{font-size:.7rem;letter-spacing:.12em;color:#91b4ef;font-weight:900;margin-bottom:10px}
.lucha-athlete{display:flex;gap:8px;align-items:center;background:#06162b;border:1px solid #345078;border-radius:8px;padding:11px 8px;margin-bottom:6px;min-height:48px;font-weight:800;overflow-wrap:anywhere}
.lucha-athlete.victor{background:#143929;border-color:#39ff14}.lucha-athlete b{margin-left:auto;color:#39ff14}
.lucha-corner{width:6px;min-width:6px;height:29px;border-radius:4px}.lucha-corner.blue{background:#3e96ff;box-shadow:0 0 12px #3e96ff}.lucha-corner.red{background:#ff4e68;box-shadow:0 0 12px #ff4e68}
.lucha-vs{width:100%;margin:8px 0;background:linear-gradient(100deg,#173a75,#335ac0);border-color:#84a7ff;color:white;font-size:.9rem;padding:12px}
.lucha-match select{width:100%;font-size:.77rem}
@media(max-width:900px){.lucha-bracket{grid-template-columns:repeat(3,minmax(250px,1fr));gap:15px}}

/* Lucha v11: compacto, estados neutros y clasificación previa */
.lucha-bracket{gap:12px;grid-template-columns:1.15fr 1fr 1fr;margin:8px 0 14px;padding:5px 0 10px}
.lucha-stage{gap:8px;min-width:200px}.lucha-stage h3{font-size:.76rem;margin-bottom:4px}
.lucha-match{padding:8px;border-radius:9px;box-shadow:none}.lucha-match.decided{border-color:#39ff1488}
.lucha-match-head{margin-bottom:5px;font-size:.65rem}.lucha-athlete{padding:6px 7px;min-height:33px;margin:3px 0;font-size:.78rem;gap:6px;border-radius:5px}
.lucha-athlete.pending{background:#222b39;border-color:#667181;color:#aab5c3}.lucha-athlete.pending .lucha-corner{background:#667181;box-shadow:none}
/* Combate Total: rival pendiente gris, participante confirmado en llave con contorno verde */
.lucha-athlete.waiting{border:2px solid #39ff14;background:#0a2230;box-shadow:inset 0 0 0 1px #39ff1433,0 0 8px #39ff1422}

.lucha-corner{height:20px;width:4px;min-width:4px}.lucha-vs{margin:5px 0;padding:7px;font-size:.76rem}
.lucha-match select{padding:5px;font-size:.72rem;margin:3px 0}.lucha-rank-table{min-width:0}.lucha-rank-table th,.lucha-rank-table td{padding:9px 12px}
.lucha-start{background:linear-gradient(100deg,#1c458d,#315cba);border:1px solid #8baeff;padding:13px 22px;font-size:1rem}
@media(max-width:900px){.lucha-bracket{grid-template-columns:repeat(3,minmax(205px,1fr));gap:9px}}

/* Panel de resultados: medallas con profundidad y acabado metalizado */
.lucha-results{margin-top:18px}
.lucha-medal-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.lucha-podium-card{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:13px;min-height:122px;padding:17px 15px;border-radius:14px;color:#283144;border:2px solid var(--medal-edge);background:linear-gradient(120deg,#fff 0%,var(--medal-light) 30%,var(--medal-mid) 58%,#fff 77%,var(--medal-light) 100%);box-shadow:inset 0 2px 2px #ffffffdd,inset 0 -5px 8px #00000012,0 9px 22px #0007,0 0 19px var(--medal-glow)}
.lucha-podium-card:before{content:'';position:absolute;inset:-80% auto -80% 36%;width:32%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff8a,transparent);pointer-events:none}
.lucha-podium-1{--medal-edge:#c79a21;--medal-light:#fff4c7;--medal-mid:#e5bf59;--medal-glow:#e5b93355}
.lucha-podium-2{--medal-edge:#8799a8;--medal-light:#f0f5f9;--medal-mid:#b5c3d0;--medal-glow:#b9c7d455}
.lucha-podium-3{--medal-edge:#a76b40;--medal-light:#fce4d2;--medal-mid:#c9946f;--medal-glow:#bd795455}
.lucha-medal-icon{display:grid;place-items:center;flex:none;width:59px;height:59px;border-radius:50%;font-family:Georgia,serif;font-size:31px;font-weight:900;color:#fff;background:radial-gradient(circle at 30% 25%,#ffffff99,transparent 40%),linear-gradient(135deg,var(--medal-light),var(--medal-edge) 60%,#77572e);border:4px double #fff9;box-shadow:0 3px 7px #0005,inset 0 2px 3px #fff9;text-shadow:0 2px 3px #0008}
.lucha-medal-detail{min-width:0;flex:1;position:relative;z-index:1}
.lucha-medal-title{font-size:.76rem;font-weight:900;letter-spacing:.08em;color:#584b3b}
.lucha-medal-name{font-size:1.06rem;font-weight:950;line-height:1.25;margin:8px 0 5px;overflow-wrap:anywhere}
.lucha-medal-id{font-size:.74rem;font-weight:750;color:#5b6371}
.lucha-medal-crest{position:absolute;right:10px;top:4px;color:var(--medal-edge);font-size:30px;opacity:.55}
.lucha-podium-card.undecided{filter:saturate(.45);opacity:.7}
.lucha-result-table{margin-top:8px}.lucha-pending-row{color:#9cabbc}
@media(max-width:900px){.lucha-medal-board{grid-template-columns:1fr}.lucha-podium-card{min-height:95px}}

/* Rotura: tres acciones independientes, navegación fluida y clasificación */
.rotura-table{min-width:1150px}
.rotura-table td{vertical-align:top}
.rotura-station{display:grid;grid-template-columns:minmax(115px,1fr) 95px;gap:7px;min-width:235px}
.rotura-station .rotura-field{width:100%;min-width:0}
.rotura-choices{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.rotura-choice{padding:7px 3px;font-size:.68rem;border:1px solid #526c82;background:#142a3d;color:#a9bfce;border-radius:6px;white-space:nowrap}
.rotura-choice.chosen{background:#164a31;border-color:#39ff14;color:#dcffe1;box-shadow:0 0 10px #39ff1444}
.rotura-choice[data-score="0"].chosen{background:#492333;border-color:#ff5478;color:#ffd9e1}
.rotura-choice[data-score="3"].chosen{background:#4a3816;border-color:#ffca50;color:#fff0bd}
.rotura-field:focus-visible,.rotura-choice:focus-visible{outline:2px solid #36e9ff;outline-offset:2px}
.rotura-rank-medal td{color:#17263b;background:linear-gradient(110deg,#fff,#f0f5fa,#fff)!important}
.rotura-rank-1 td:first-child{border-left:5px solid #e3b535;color:#a17a05}
.rotura-rank-2 td:first-child{border-left:5px solid #a4b6c5;color:#667c8d}
.rotura-rank-3 td:first-child{border-left:5px solid #bd865a;color:#98623c}

/* Ranking de Rotura v21: tarjetas neon, podio reservado para resultados completos */
.rotura-leaderboard{margin-top:18px;padding:20px;border:1px solid #357b9c;border-radius:15px;background:linear-gradient(145deg,#0a2035,#0a182a 80%);box-shadow:0 12px 30px #0004}
.rotura-leaderboard-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
.rotura-leaderboard-kicker{font-size:.66rem;letter-spacing:.16em;font-weight:800;color:#59d9ed;margin-bottom:5px}
.rotura-leaderboard-head h3{margin:0;color:#eaf7ff;font-size:1.08rem}
.rotura-live{font-size:.7rem;color:#70dbe4;border:1px solid #28667b;background:#0c3340;padding:8px 11px;border-radius:30px;white-space:nowrap}
.rotura-leaderboard-list{display:grid;gap:8px}
.rotura-board-row{display:grid;grid-template-columns:65px minmax(0,1fr) 130px 125px;gap:12px;align-items:center;padding:12px 15px;background:linear-gradient(100deg,#112d46,#0d2237);border:1px solid #29465e;border-radius:10px;min-height:66px}
.rotura-board-place{font-size:1.5rem;font-weight:950;color:#67dff5;text-align:center}
.rotura-board-athlete{display:grid;gap:5px;min-width:0}
.rotura-board-athlete strong{font-size:.96rem;color:#f0f7ff;overflow-wrap:anywhere}
.rotura-board-athlete small,.rotura-board-score small{font-size:.65rem;letter-spacing:.09em;color:#90a9bd;font-weight:750}
.rotura-board-score{display:grid;gap:4px;text-align:right}
.rotura-board-score strong{font-size:1.27rem;color:#f2f8ff;font-variant-numeric:tabular-nums}
.rotura-board-state{justify-self:end;text-align:center;font-size:.66rem;font-weight:850;color:#a5b7c8;border:1px solid #4a6075;background:#23354a;padding:7px 9px;border-radius:20px}
.rotura-board-state.is-complete{color:#90f0b5;background:#143c33;border-color:#34876a}
.rotura-board-medal{border-width:2px;box-shadow:inset 0 2px 2px #ffffff88,0 5px 18px #0005}
.rotura-board-medal .rotura-board-athlete strong,.rotura-board-medal .rotura-board-score strong{color:#203044}
.rotura-board-medal .rotura-board-athlete small,.rotura-board-medal .rotura-board-score small{color:#576b7d}
.rotura-board-medal .rotura-board-place{font-size:1.9rem}
.rotura-board-1{border-color:#e0b343;background:linear-gradient(110deg,#fffdf3,#f2d88a,#fffaf0)}
.rotura-board-2{border-color:#a3b3c2;background:linear-gradient(110deg,#fff,#cfdbe4,#f8fbff)}
.rotura-board-3{border-color:#b98258;background:linear-gradient(110deg,#fffaf6,#e2ba9c,#fff7f0)}

</style></head><body><header><div><div class="eyebrow">TAEKWON-DO TOTAL · CONTROL DE COMPETENCIA</div><h1>FINALES</h1></div><div class="actions"><span class="pill" id="globalCount">—</span><button id="viewPodiums" class="podiums-button">🏆 VER PODIO</button><button onclick="location.href='acreditaciones.html'">← ACREDITACIONES</button><button id="refresh">↻ ACTUALIZAR</button></div></header><main><nav class="tabs" id="tabs"><button data-tab="salto" class="active">SALTO</button><button data-tab="rotura">ROTURA</button><button data-tab="lucha">LUCHA</button><button data-tab="combate">COMBATE TOTAL</button></nav><div id="content"></div><div class="podium-overlay" id="podiumOverlay" hidden><section class="podium-dialog" role="dialog" aria-modal="true" aria-labelledby="podiumDialogTitle"><div class="podium-dialog-head"><div><small>TAEKWON-DO TOTAL · FINALES</small><h2 id="podiumDialogTitle">🏆 PODIOS DEL TORNEO</h2></div><button type="button" id="closePodiums" class="podium-close">✕ CERRAR</button></div><div class="podium-scroll" id="podiumContent"></div></section></div><div class="footer">FINALES · Los resultados de esta etapa no alteran el All Around de clasificatorias.</div></main><script>
(()=>{'use strict';
const AC='ct_acreditaciones_v1',PREFIX='ct_results_sync_v1_',FINAL='ct_finales_v1',AREAS=Array.from({length:8},(_,i)=>String(i+1));
const W=[{id:'w1',label:'≤ 58 KG',min:-Infinity,max:58},{id:'w2',label:'58–65 KG',min:58,max:65},{id:'w3',label:'65–72 KG',min:65,max:72},{id:'w4',label:'72–80 KG',min:72,max:80},{id:'w5',label:'80–90 KG',min:80,max:90},{id:'w6',label:'> 90 KG',min:90,max:Infinity}];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=(s,f)=>{try{return JSON.parse(s)||f}catch{return f}}, num=v=>{const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const time=v=>{if(v===null||v===undefined||v==='')return Infinity;if(typeof v==='number')return Number.isFinite(v)?v:Infinity;const s=String(v).replace(',','.');if(s.includes(':')){const [m,sec]=s.split(':');const n=Number(m)*60+Number(sec);return Number.isFinite(n)?n:Infinity}const n=Number(s);return Number.isFinite(n)?n:Infinity};
const state=parse(localStorage.getItem(FINAL),{});state.salto??={};state.rotura??={};state.lucha??={};state.combate??={};const save=()=>localStorage.setItem(FINAL,JSON.stringify(state));
let tab='salto',weight='w1',people=[],results={},lists={};
function load(){people=parse(localStorage.getItem(AC),[]);if(!Array.isArray(people))people=[];results={};for(const a of AREAS){const o=parse(localStorage.getItem(PREFIX+a),{});for(const [id,r] of Object.entries(o||{})){if(!results[id])results[id]={};const old=results[id];for(const [k,v] of Object.entries(r||{})){if(v!==null&&v!=='')old[k]=v}}}compute();$('#globalCount').textContent=people.filter(x=>x.acreditado).length+' ACREDITADOS'}
function compute(){const all=people.filter(p=>p.acreditado&&p.id!=null).map(p=>({...p,id:String(p.id),r:results[String(p.id)]||{}}));const salto=all.filter(p=>num(p.r.saltoPuntaje)>0&&num(p.hds)>0).sort((a,b)=>num(b.hds)-num(a.hds)||num(b.r.saltoPuntaje)-num(a.r.saltoPuntaje));const rotura=all.filter(p=>num(p.r.roturaPuntaje)>0).sort((a,b)=>num(b.r.roturaPuntaje)-num(a.r.roturaPuntaje));const lucha=all.filter(p=>num(p.r.luchaPuntaje)>0).sort((a,b)=>num(b.r.luchaPuntaje)-num(a.r.luchaPuntaje));lists={salto:salto.slice(0,8),rotura:rotura.slice(0,8),lucha:lucha.slice(0,8),combate:{}};for(const w of W){lists.combate[w.id]=all.filter(p=>num(p.peso)>w.min&&num(p.peso)<=w.max&&num(p.r.combatePuntaje)>0).sort((a,b)=>time(a.r.combateTiempoFin)-time(b.r.combateTiempoFin)||num(b.r.combatePuntaje)-num(a.r.combatePuntaje)).slice(0,8)}}
const athlete=id=>people.find(p=>String(p.id)===String(id));const label=id=>{const p=athlete(id);return p?`#${esc(p.id)} · ${esc(p.nombre||'SIN NOMBRE')}`:'—'};
function badgeList(list){return `<span class="pill">${list.length} FINALISTAS</span>`}function intro(title,list,extra=''){return `<div class="panel"><div class="heading"><h2>${title}</h2>${badgeList(list)}</div>${extra}</div>`}
function notice(msg){return `<div class="notice">${msg}</div>`}function fmt(n){return Number(n).toFixed(2)}
function jumpSnapshot(round,list){
  const st=state.salto;
  st.roundEntries??={};
  const key=String(round);
  const eligible=list.filter(p=>!Object.entries((st[p.id]||{}).logs||{}).some(([k,v])=>Number(k)<round&&v==='fail'));
  const gold=st.goldRounds?.[key];const fresh=(gold?list.filter(p=>gold.ids.includes(String(p.id))):eligible).map(p=>({id:String(p.id),nombre:p.nombre||'',hds:num(p.hds)}));
  const previous=st.roundEntries[key];

  // Mientras no haya intentos registrados, sincronizamos con los clasificados actuales.
  const hasAttempts=(previous||[]).some(p=>Object.prototype.hasOwnProperty.call((st[p.id]||{}).logs||{},key));
  if(!Array.isArray(previous)||!hasAttempts){
    const changed=JSON.stringify(previous)!==JSON.stringify(fresh);

function jumpGoldReference(people, beforeRound){
 const st=state.salto, achieved=[];
 for(const p of people)for(const [key,val] of Object.entries(st[p.id]?.logs||{})){
  const r=Number(key);
  if(val==='ok'&&r<beforeRound&&!st.goldRounds?.[key])achieved.push(jumpHeight(r));
 }
 return achieved.length?Math.max(...achieved):jumpHeight(beforeRound);
}
function jumpHeight(n){const st=state.salto;const manual=st.roundHeights?.[String(n)];if(manual!==undefined&&Number.isFinite(Number(manual)))return Number(manual);return Math.round((Number(st.startHeight||0)+n*.05)*100)/100}
function jumpBaseGroups(list){
 const st=state.salto,groups=new Map(),alive=[];
 for(const p of list){const logs=st[p.id]?.logs||{};const failures=Object.keys(logs).filter(k=>logs[k]==='fail'&&!st.goldRounds?.[k]).map(Number);if(!failures.length){alive.push(p);continue}const r=Math.min(...failures);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(p)}
 const sorted=[...groups.entries()].sort((a,b)=>b[0]-a[0]);let pos=alive.length+1;
 return {alive,groups:sorted.map(([round,people])=>{const o={round,people,rank:pos};pos+=people.length;return o})};
}
function jumpMedalTie(list){
 const st=state.salto,base=jumpBaseGroups(list);
 return base.groups.find(g=>g.people.length>1&&g.rank<=3&&!g.people.every(p=>st.goldResolved?.[p.id]!=null))||null;
}
function jumpGoldRound(st,round,people,rank,height){
 st.goldRounds??={};st.roundHeights??={};st.roundEntries??={};
 st.goldRounds[String(round)]={ids:people.map(p=>String(p.id)),rank,reference:height};
 st.goldResolvedAtRound??={};st.goldResolvedAtRound[String(round)]={...(st.goldResolved||{})};
 st.roundHeights[String(round)]=Math.round(height*100)/100;

function jumpStatus(list,round){
 const st=state.salto,entries=st.roundEntries?.[String(round)]||[];
 const done=entries.map(p=>({id:String(p.id),v:st[p.id]?.logs?.[round]}));
 const pending=done.some(x=>x.v!=='ok'&&x.v!=='fail');
 const success=done.filter(x=>x.v==='ok'),failed=done.filter(x=>x.v==='fail');
 const gold=st.goldRounds?.[String(round)];
 const base=jumpBaseGroups(list);
 const tie=jumpMedalTie(list);
 const allFailed=done.length>0&&failed.length===done.length;
 const complete=base.alive.length===0&&!tie&&!gold&&list.length>=3;
 // En salto de oro se repite hasta resolver los puestos, incluso si todos fallan.
 const advance=!pending&&done.length>0&&!complete&&(gold?true:success.length>0||Boolean(tie));
 let reason='';
 if(complete)reason='El podio ya está definido.';
 else if(pending)reason='Primero registrá todos los intentos.';
 else if(!done.length)reason='No hay participantes.';
 else if(!gold&&!success.length&&!tie)reason='Nadie logró el salto y no existe un empate por medallas.';

}
function jumpRanking(list){
 const st=state.salto,base=jumpBaseGroups(list),ranking=new Map();
 for(const g of base.groups)for(const p of g.people)ranking.set(p.id,g.rank);

 const rows=list.map(p=>{const logs=st[p.id]?.logs||{},normal=Object.entries(logs).filter(([k,v])=>!st.goldRounds?.[k]&&(v==='ok'||v==='fail'));const best=normal.filter(([k,v])=>v==='ok').map(([k])=>jumpHeight(Number(k)));const rank=ranking.get(p.id);return {p,rank,best:best.length?Math.max(...best):null,active:rank==null}});
 rows.sort((a,b)=>(a.rank==null?1:0)-(b.rank==null?1:0)||(a.rank??999)-(b.rank??999)||a.p.id.localeCompare(b.p.id));
 const medals=['ORO','PLATA','BRONCE'];
 const medalCards=medals.map((m,i)=>{
   const candidates=rows.filter(r=>r.rank===i+1);
   const r=candidates.length===1?candidates[0]:null;
   return `<div class="lucha-podium-card lucha-podium-${i+1} ${r?'':'undecided'}"><div class="lucha-medal-icon">${['Ⅰ','Ⅱ','Ⅲ'][i]}</div><div class="lucha-medal-detail"><div class="lucha-medal-title">${i+1}° PUESTO · ${m}</div><div class="lucha-medal-name">${r?esc(r.p.nombre):'POR DEFINIR'}</div><div class="lucha-medal-id">${r?'COMPETIDOR N° '+esc(r.p.id):'Pendiente de resultado'}</div></div><div class="lucha-medal-crest">✦</div></div>`;

 return `<div class="panel lucha-results"><div class="heading"><h2>RESULTADOS · FINAL DE SALTO</h2><span class="pill">${rows.length} FINALISTAS</span></div><div class="lucha-medal-board">${medalCards}</div><div class="table-wrap"><table class="lucha-result-table"><thead><tr><th>Puesto</th><th>N°</th><th>Competidor</th><th>Mejor salto</th><th>Estado</th></tr></thead><tbody>`+rows.map(r=>`<tr class="${r.rank==null?'lucha-pending-row':''}"><td class="num">${r.rank==null?'—':r.rank+'°'}</td><td>${esc(r.p.id)}</td><td class="name">${esc(r.p.nombre)}</td><td>${r.best===null?'—':fmt(r.best)+' m'}</td><td>${r.active?'EN COMPETENCIA / DESEMPATE':'PUESTO REGISTRADO'}</td></tr>`).join('')+`</tbody></table></div><p class="hint">Los puestos se registran al quedar definidos. Los empates por medalla se resuelven mediante Salto de Oro.</p></div>`;

function salto(){
  const list=lists.salto,st=state.salto;
  const avg=list.length?list.reduce((a,p)=>a+num(p.hds),0)/list.length:0;

  html+=`<div class="panel"><div class="toolbar"><button data-act="prevJump" ${round===0?'disabled':''}>← ALTURA ANTERIOR</button><button data-act="nextJump" ${!status.advance?'disabled':''}>${status.gold?(status.success.length>0&&status.failed.length>0&&status.gold.ids.length===2?'CERRAR PODIO ✓':'SIGUIENTE SALTO DE ORO →'):status.tie&&status.allFailed?'INICIAR SALTO DE ORO →':'SIGUIENTE RONDA →'}</button><span class="pill">${entrants.length} INICIARON ESTA RONDA</span><button class="danger" data-act="resetJumpRound">↺ REINICIAR ESTA RONDA</button></div><div class="jump-height-control"><label for="manualJumpHeight">ALTURA DE ESTA RONDA</label><input id="manualJumpHeight" type="number" min="0.01" max="20" step="0.01" data-jump-height="${round}" value="${fmt(height)}"> <span class="hint">En metros · editable y guardada por ronda</span></div><div class="jump-height-control"><label for="jumpDelta">VARIACIÓN PARA LA SIGUIENTE RONDA</label><input id="jumpDelta" type="number" step="0.01" min="-2" max="2" data-jump-delta value="${fmt(Number(st.jumpDelta ?? .05))}"> <span class="hint">Metros · +0.05 sube 5 cm · 0 repite · -0.05 baja 5 cm</span></div></div>`;
  html+='<div class="panel"><div class="table-wrap"><table><thead><tr><th>#</th><th>Finalista</th><th>Altura clasificatoria</th><th>Última altura lograda</th><th>Estado</th><th>Intento</th></tr></thead><tbody>';

function roturaStandings(){

 }
