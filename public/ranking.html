  <header>

  <div class="top-bar">

  <script>
    // ====== CONFIGURACIÓN BÁSICA ======
    const AREAS = ["1","2","3","4","5","6","7","8"];
    const STORAGE_ACREDITACIONES = "ct_acreditaciones_v1";
    const RESULT_SYNC_PREFIX     = "ct_results_sync_v1_";

    const CATEGORIES = [
      { id: "allAround", label: "All-Around",        field: "allAroundPuntaje" },
      { id: "salto",     label: "Salto",             field: "saltoPuntaje" },
      { id: "rotura",    label: "Rotura",            field: "roturaPuntaje" },
      { id: "lucha",     label: "Lucha por puntos",  field: "luchaPuntaje" },
      { id: "combate",   label: "Combate Total",     field: "combatePuntaje" } // ← especial: ordena por tiempo y luego puntaje
    ];

    const TOP_N = 10;

    // ====== HELPERS ======
    function safeParse(json, fallback) {
      try { return JSON.parse(json); } catch { return fallback; }
    }

    function leerAcreditaciones() {
      const raw = localStorage.getItem(STORAGE_ACREDITACIONES);
      return raw ? safeParse(raw, []) : [];
    }

    function leerResultadosTodasAreas() {
      const resultados = [];
      for (const area of AREAS) {
        const raw = localStorage.getItem(RESULT_SYNC_PREFIX + area);
        if (!raw) continue;
        const obj = safeParse(raw, {});
        for (const [idStr, data] of Object.entries(obj)) {
          resultados.push({
            area,
            id: Number(idStr),
            ...data
          });
        }
      }
      return resultados;
    }

    function buildIndexAcreditaciones(acreditaciones) {
      const map = new Map();
      for (const c of acreditaciones) {
        if (c && c.id != null) {
          map.set(String(c.id), c);
        }
      }
      return map;
    }

    // Convierte "MM:SS" o "MM:SS.mmm" o "12.345" → segundos (número)
    function parseTiempoFinToSeconds(val) {
      if (val == null) return Infinity;
      if (typeof val === "number") {
        return Number.isFinite(val) ? val : Infinity;
      }
      if (typeof val !== "string") return Infinity;

      const str = val.trim();
      if (!str) return Infinity;

      if (str.includes(":")) {
        // Formato "MM:SS" o "MM:SS.mmm"
        const [mmStr, rest] = str.split(":");
        const mm = parseInt(mmStr, 10);
        const ss = parseFloat(rest.replace(",", "."));
        if (Number.isNaN(mm) || Number.isNaN(ss)) return Infinity;
        return mm * 60 + ss;
      }

      const num = parseFloat(str.replace(",", "."));
      return Number.isNaN(num) ? Infinity : num;
    }

function calcularRankings(acreditaciones, resultados) {
  const idxAcred = buildIndexAcreditaciones(acreditaciones);

  // Estructura base por categoría
  const byCat = {};
  for (const cat of CATEGORIES) {
    byCat[cat.id] = [];
  }

  // Mapa para All-Around
  // { id, nombre, area, lucha, rotura, salto, combate }
  const allMap = new Map();

  for (const r of resultados) {
    const idStr = String(r.id);
    const compAcred = idxAcred.get(idStr) || {};
    const nombre = compAcred.nombre || compAcred.nombreCompleto || `ID ${r.id}`;
    const area = r.area;

    // Aseguramos entrada en All-Around
    let aa = allMap.get(idStr);
    if (!aa) {
      aa = { id: r.id, nombre, area, lucha: 0, rotura: 0, salto: 0, combate: 0 };
      allMap.set(idStr, aa);
    }

// Recorremos categorías, excepto allAround
for (const cat of CATEGORIES) {

  if (cat.id === "allAround") continue;

  // =========================
  // SALTO
  // =========================
if (cat.id === "salto") {

  const puntajeSalto = Number(r.saltoPuntaje || 0);

  // La altura a saltar está en la acreditación del competidor (HdS)
  const alturaSalto = Number(
    String(compAcred.hds ?? 0).replace(",", ".")
  );

  // Si tiene puntaje de salto significa que logró el salto
  if (
    puntajeSalto > 0 &&
    Number.isFinite(alturaSalto) &&
    alturaSalto > 0
  ) {

    byCat.salto.push({
      id: r.id,
      nombre,
      area,
      altura: alturaSalto,
      puntaje: puntajeSalto
    });
  }

  // Para All-Around seguimos usando el puntaje
  if (puntajeSalto > 0) {
    if (aa.salto == null || puntajeSalto > aa.salto) {
      aa.salto = puntajeSalto;
    }
  }

  continue;
}

  // =========================
  // RESTO DE DISCIPLINAS
  // =========================

  const field = cat.field;
  const rawVal = r[field];

  if (rawVal == null || rawVal === "") continue;

  const val =
    typeof rawVal === "number"
      ? rawVal
      : Number(rawVal);

  if (!Number.isFinite(val) || val <= 0) continue;

  const item = {
    id: r.id,
    nombre,
    area,
    puntaje: val
  };

  if (cat.id === "combate") {
    const rawTime = r.combateTiempoFin;

    item.tiempoRaw = rawTime ?? null;
    item.tiempoNum = parseTiempoFinToSeconds(rawTime);
  }

  byCat[cat.id].push(item);

  // All-Around
  if (aa[cat.id] == null || val > aa[cat.id]) {
    aa[cat.id] = val;
  }
}
  }

  // Construimos lista de All-Around
  const allList = [];
  for (const aa of allMap.values()) {
    const total =
      (aa.lucha   || 0) +
      (aa.rotura  || 0) +
      (aa.salto   || 0) +
      (aa.combate || 0);

    if (total > 0) {
      allList.push({
        id: aa.id,
        nombre: aa.nombre,
        area: aa.area,
        puntaje: total
      });
    }
  }
  byCat["allAround"] = allList;

// Ordenar cada categoría
for (const cat of CATEGORIES) {

  const list = byCat[cat.id] || [];

  if (cat.id === "combate") {

    list.sort((a, b) => {
      const ta = a.tiempoNum ?? Infinity;
      const tb = b.tiempoNum ?? Infinity;

      if (ta !== tb) {
        return ta - tb;
      }

      return b.puntaje - a.puntaje;
    });

  } else if (cat.id === "salto") {

    // MAYOR ALTURA = MEJOR POSICIÓN
    list.sort((a, b) => {

      if (b.altura !== a.altura) {
        return b.altura - a.altura;
      }

      // Desempate: mayor puntaje
      return b.puntaje - a.puntaje;
    });

  } else {

    // Rotura, Lucha y All-Around
    list.sort((a, b) => b.puntaje - a.puntaje);
  }

  byCat[cat.id] = list.slice(0, TOP_N);
}

  return byCat;
}







    function formatScore(num) {
      return num.toFixed(3);
    }

    function formatSeconds(num) {
      if (!Number.isFinite(num)) return "—";
      return num.toFixed(3);
    }

    function setLastUpdate() {
      const el = document.getElementById("lastUpdate");
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      el.textContent = `Última actualización: ${now.toLocaleDateString()} ${hh}:${mm}:${ss}`;
    }

    // ====== RENDER ======
    function renderRankings(rankings) {
      const container = document.getElementById("categoriesContainer");
      container.innerHTML = "";

      for (const cat of CATEGORIES) {
        const list = rankings[cat.id] || [];

        const card = document.createElement("section");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "card-header";

        const title = document.createElement("div");
        title.className = "card-title";
        title.innerHTML = `${cat.label} <span>TOP ${TOP_N}</span>`;

        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = "En vivo";

        header.appendChild(title);
        header.appendChild(badge);
        card.appendChild(header);

        if (!list.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Sin resultados aún";
          card.appendChild(empty);
          container.appendChild(card);
          continue;
        }

        const wrap = document.createElement("div");
        wrap.className = "table-wrap";

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");

        // Encabezado dinámico: Combate muestra Tiempo + Puntaje
        if (cat.id === "combate") {
          thead.innerHTML = `
            <tr>
              <th>#</th>
              <th>Competidor</th>
              <th>Área</th>
              <th>Tiempo</th>
              <th>Puntaje</th>
            </tr>
          `;
        } else if (cat.id === "salto") {

  thead.innerHTML = `
    <tr>
      <th>#</th>
      <th>Competidor</th>
      <th>Área</th>
      <th>Altura</th>
      <th>Puntaje</th>
    </tr>
  `;

} else {

  thead.innerHTML = `
    <tr>
      <th>#</th>
      <th>Competidor</th>
      <th>Área</th>
      <th>Puntaje</th>
    </tr>
  `;
}

        list.forEach((item, index) => {
          const tr = document.createElement("tr");

          const tdRank = document.createElement("td");
          tdRank.className = "td-rank";
          tdRank.textContent = index + 1;

          const tdName = document.createElement("td");
          tdName.className = "td-name";
          tdName.textContent = item.nombre;

          const tdArea = document.createElement("td");
          tdArea.className = "td-area";
          tdArea.textContent = item.area;

          tr.appendChild(tdRank);
          tr.appendChild(tdName);
          tr.appendChild(tdArea);

          if (cat.id === "combate") {
            const tdTime = document.createElement("td");
            tdTime.className = "td-time";

            // Convertimos el tiempo a segundos con decimales
            const seconds = parseTiempoFinToSeconds(
              item.tiempoRaw != null ? item.tiempoRaw : item.tiempoNum
            );

            tdTime.textContent = Number.isFinite(seconds)
              ? seconds.toFixed(3)   // 👉 formato sss.sss
              : "—";

            const tdScore = document.createElement("td");
            tdScore.className = "td-score";
            tdScore.textContent = formatScore(item.puntaje);

            tr.appendChild(tdTime);
            tr.appendChild(tdScore);
              } else if (cat.id === "salto") {

              const tdAltura = document.createElement("td");
              tdAltura.className = "td-score";
              tdAltura.textContent = `${Number(item.altura).toFixed(3)} m`;

              const tdScore = document.createElement("td");
              tdScore.className = "td-score";
              tdScore.textContent = formatScore(item.puntaje);

              tr.appendChild(tdAltura);
              tr.appendChild(tdScore);

            } else {

              const tdScore = document.createElement("td");
              tdScore.className = "td-score";
              tdScore.textContent = formatScore(item.puntaje);

              tr.appendChild(tdScore);
            }

          tbody.appendChild(tr);

        table.appendChild(thead);
        table.appendChild(tbody);
        wrap.appendChild(table);

        container.appendChild(card);
      }
    }

    // ====== CARGA / REFRESCO ======
    function loadAndRender() {
      const acreditaciones = leerAcreditaciones();
      const resultados = leerResultadosTodasAreas();
      const rankings = calcularRankings(acreditaciones, resultados);
      renderRankings(rankings);
      setLastUpdate();
    }

    // Primer render
    loadAndRender();

    // Botón manual
    document.getElementById("btnRefresh").addEventListener("click", () => {
      loadAndRender();
    });

    // Escuchar cambios en localStorage de otras pestañas (áreas)
    window.addEventListener("storage", (ev) => {
      if (!ev.key) return;
      if (
        ev.key === STORAGE_ACREDITACIONES ||
        AREAS.some(area => ev.key === RESULT_SYNC_PREFIX + area)
      ) {
        loadAndRender();
      }
    });

    // ====== PANTALLA COMPLETA + ESC PARA CERRAR ======
    let fullscreenRequested = false;

    function tryEnterFullscreen() {
      if (fullscreenRequested) return;
      fullscreenRequested = true;
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    // Cualquier clic entra a fullscreen (primer intento)

      if (!document.fullscreenElement) {
        tryEnterFullscreen();
      }
    });

    // Teclas: primera tecla distinta de ESC intenta fullscreen.
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") {
        // Salir de fullscreen si está, y luego intentar cerrar
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
        // Si la ventana fue abierta por script, se cerrará; si no, el navegador lo ignora
        window.close();
        return;
      }

      if (!document.fullscreenElement) {
        tryEnterFullscreen();
      }
    });

.screen.transition-out{animation:boardOut .35s cubic-bezier(.4,0,1,1) both}

@keyframes boardOut{to{opacity:0;transform:translateX(-34px) rotateY(2deg);filter:blur(5px)}}
@keyframes headingIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}

@keyframes rowIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

/* Overlay preparado para superponer sobre una transmisión de video. */
html,body{background:transparent!important;background-color:transparent!important}
header,.top-bar,.bottom{background:transparent!important;box-shadow:none!important}
header{border-bottom-color:transparent!important}
.bottom{border-top-color:transparent!important}
/* Los paneles del ranking mantienen su contraste y legibilidad. */

/* Barra discreta para overlay */
.bottom{padding:8px 3vw 12px;border:0!important;box-shadow:none!important;background:transparent!important}
.progress{height:5px;background:rgba(6,19,33,.55);border-radius:4px}
.progress-fill{background:#24536a;box-shadow:none}

<body>
<header><div><h1>TAEKWON-DO TOTAL</h1><div class="subtitle">RANKING GENERAL · 8 ÁREAS</div></div><div class="live">● EN VIVO</div></header>
<div class="top-bar"><div id="lastUpdate" class="last-update">Última actualización: —</div></div>
<main class="screen" id="categoriesContainer"></main>
<div class="bottom"><div class="progress"><div class="progress-fill" id="progressFill"></div></div></div>

<script>
    // ====== CONFIGURACIÓN BÁSICA ======
    const AREAS = ["1","2","3","4","5","6","7","8"];
    const STORAGE_ACREDITACIONES = "ct_acreditaciones_v1";
    const RESULT_SYNC_PREFIX     = "ct_results_sync_v1_";

    const CATEGORIES = [
      { id: "allAround", label: "All-Around",        field: "allAroundPuntaje" },
      { id: "salto",     label: "Salto",             field: "saltoPuntaje" },
      { id: "rotura",    label: "Rotura",            field: "roturaPuntaje" },
      { id: "lucha",     label: "Lucha por puntos",  field: "luchaPuntaje" },
      { id: "combate",   label: "Combate Total",     field: "combatePuntaje" } // ← especial: ordena por tiempo y luego puntaje
    ];

    const TOP_N = 10;

    // ====== HELPERS ======
    function safeParse(json, fallback) {
      try { return JSON.parse(json); } catch { return fallback; }
    }

    function leerAcreditaciones() {
      const raw = localStorage.getItem(STORAGE_ACREDITACIONES);
      return raw ? safeParse(raw, []) : [];
    }

    function leerResultadosTodasAreas() {
      const resultados = [];
      for (const area of AREAS) {
        const raw = localStorage.getItem(RESULT_SYNC_PREFIX + area);
        if (!raw) continue;
        const obj = safeParse(raw, {});
        for (const [idStr, data] of Object.entries(obj)) {
          resultados.push({
            area,
            id: Number(idStr),
            ...data
          });
        }
      }
      return resultados;
    }

    function buildIndexAcreditaciones(acreditaciones) {
      const map = new Map();
      for (const c of acreditaciones) {
        if (c && c.id != null) {
          map.set(String(c.id), c);
        }
      }
      return map;
    }

    // Convierte "MM:SS" o "MM:SS.mmm" o "12.345" → segundos (número)
    function parseTiempoFinToSeconds(val) {
      if (val == null) return Infinity;
      if (typeof val === "number") {
        return Number.isFinite(val) ? val : Infinity;
      }
      if (typeof val !== "string") return Infinity;

      const str = val.trim();
      if (!str) return Infinity;

      if (str.includes(":")) {
        // Formato "MM:SS" o "MM:SS.mmm"
        const [mmStr, rest] = str.split(":");
        const mm = parseInt(mmStr, 10);
        const ss = parseFloat(rest.replace(",", "."));
        if (Number.isNaN(mm) || Number.isNaN(ss)) return Infinity;
        return mm * 60 + ss;
      }

      const num = parseFloat(str.replace(",", "."));
      return Number.isNaN(num) ? Infinity : num;
    }

function calcularRankings(acreditaciones, resultados) {
  const idxAcred = buildIndexAcreditaciones(acreditaciones);

  // Estructura base por categoría
  const byCat = {};
  for (const cat of CATEGORIES) {
    byCat[cat.id] = [];
  }

  // Mapa para All-Around
  // { id, nombre, area, lucha, rotura, salto, combate }
  const allMap = new Map();

  for (const r of resultados) {
    const idStr = String(r.id);
    const compAcred = idxAcred.get(idStr) || {};
    const nombre = compAcred.nombre || compAcred.nombreCompleto || `ID ${r.id}`;
    const area = r.area;

    // Aseguramos entrada en All-Around
    let aa = allMap.get(idStr);
    if (!aa) {
      aa = { id: r.id, nombre, area, lucha: 0, rotura: 0, salto: 0, combate: 0 };
      allMap.set(idStr, aa);
    }

// Recorremos categorías, excepto allAround
for (const cat of CATEGORIES) {

  if (cat.id === "allAround") continue;

  // =========================
  // SALTO
  // =========================
if (cat.id === "salto") {

  const puntajeSalto = Number(r.saltoPuntaje || 0);

  // La altura a saltar está en la acreditación del competidor (HdS)
  const alturaSalto = Number(
    String(compAcred.hds ?? 0).replace(",", ".")
  );

  // Si tiene puntaje de salto significa que logró el salto
  if (
    puntajeSalto > 0 &&
    Number.isFinite(alturaSalto) &&
    alturaSalto > 0
  ) {

    byCat.salto.push({
      id: r.id,
      nombre,
      area,
      altura: alturaSalto,
      puntaje: puntajeSalto
    });
  }

  // Para All-Around seguimos usando el puntaje
  if (puntajeSalto > 0) {
    if (aa.salto == null || puntajeSalto > aa.salto) {
      aa.salto = puntajeSalto;
    }
  }

  continue;
}

  // =========================
  // RESTO DE DISCIPLINAS
  // =========================

  const field = cat.field;
  const rawVal = r[field];

  if (rawVal == null || rawVal === "") continue;

  const val =
    typeof rawVal === "number"
      ? rawVal
      : Number(rawVal);

  if (!Number.isFinite(val) || val <= 0) continue;

  const item = {
    id: r.id,
    nombre,
    area,
    puntaje: val
  };

  if (cat.id === "combate") {
    const rawTime = r.combateTiempoFin;

    item.tiempoRaw = rawTime ?? null;
    item.tiempoNum = parseTiempoFinToSeconds(rawTime);
  }

  byCat[cat.id].push(item);

  // All-Around
  if (aa[cat.id] == null || val > aa[cat.id]) {
    aa[cat.id] = val;
  }
}
  }

  // Construimos lista de All-Around
  const allList = [];
  for (const aa of allMap.values()) {
    const total =
      (aa.lucha   || 0) +
      (aa.rotura  || 0) +
      (aa.salto   || 0) +
      (aa.combate || 0);

    if (total > 0) {
      allList.push({
        id: aa.id,
        nombre: aa.nombre,
        area: aa.area,
        puntaje: total
      });
    }
  }
  byCat["allAround"] = allList;

// Ordenar cada categoría
for (const cat of CATEGORIES) {

  const list = byCat[cat.id] || [];

  if (cat.id === "combate") {

    list.sort((a, b) => {
      const ta = a.tiempoNum ?? Infinity;
      const tb = b.tiempoNum ?? Infinity;

      if (ta !== tb) {
        return ta - tb;
      }

      return b.puntaje - a.puntaje;
    });

  } else if (cat.id === "salto") {

    // MAYOR ALTURA = MEJOR POSICIÓN
    list.sort((a, b) => {

      if (b.altura !== a.altura) {
        return b.altura - a.altura;
      }

      // Desempate: mayor puntaje
      return b.puntaje - a.puntaje;
    });

  } else {

    // Rotura, Lucha y All-Around
    list.sort((a, b) => b.puntaje - a.puntaje);
  }

  byCat[cat.id] = list.slice(0, TOP_N);
}

  return byCat;
}







    function formatScore(num) {
      return num.toFixed(3);
    }

    function formatSeconds(num) {
      if (!Number.isFinite(num)) return "—";
      return num.toFixed(3);
    }

    function setLastUpdate() {
      const el = document.getElementById("lastUpdate");
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      el.textContent = `Última actualización: ${now.toLocaleDateString()} ${hh}:${mm}:${ss}`;
    }

    // ====== PRESENTACIÓN ROTATIVA ======
    const ROTATION_MS = 15000;
    let currentCategory = 0;
    let paused = false;
    let elapsed = 0;
    let lastTick = performance.now();
    let latestRankings = {};
    const container = document.getElementById("categoriesContainer");
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function renderRankings(rankings) {
      latestRankings = rankings;
      const cat = CATEGORIES[currentCategory];
      const list = rankings[cat.id] || [];
      const special = cat.id === "salto" ? "<th>Altura</th><th>Puntaje</th>" : cat.id === "combate" ? "<th>Tiempo</th><th>Puntaje</th>" : "<th>Puntaje</th>";
      const rows = list.map((item, i) => {
        let cells = "";
        if(cat.id === "salto") cells = `<td>${Number(item.altura).toFixed(3)} m</td><td>${formatScore(item.puntaje)}</td>`;
        else if(cat.id === "combate") {
          const secs = parseTiempoFinToSeconds(item.tiempoRaw != null ? item.tiempoRaw : item.tiempoNum);
          cells = `<td>${formatSeconds(secs)} s</td><td>${formatScore(item.puntaje)}</td>`;
        } else cells = `<td>${formatScore(item.puntaje)}</td>`;
        const medal = String(i+1).padStart(2,"0");
        return `<tr class="rank-${i+1}" style="--row:${i}"><td>${medal}</td><td title="${escapeHTML(item.nombre)}">${escapeHTML(item.nombre)}</td><td>${escapeHTML(item.area)}</td>${cells}</tr>`;
      }).join("");
      container.innerHTML = `<div class="category-heading"><h2>${escapeHTML(cat.label)}</h2><p>TOP ${TOP_N} · CLASIFICACIÓN GENERAL</p></div>` +
        (list.length ? `<table class="ranking"><thead><tr><th>#</th><th>Competidor</th><th>Área</th>${special}</tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Sin resultados aún</div>');
      renderedSignature = JSON.stringify([currentCategory, list]);
    }
    let transitionTimer = null;
    let renderedSignature = "";
    function changeCategory(step) {
      if (transitionTimer !== null) return;
      elapsed = 0; lastTick = performance.now();
      container.classList.remove("transition-in");
      container.classList.add("transition-out");
      transitionTimer = setTimeout(() => {
        currentCategory = (currentCategory + step + CATEGORIES.length) % CATEGORIES.length;
        container.classList.remove("transition-out");
        renderRankings(latestRankings);
        void container.offsetWidth;
        container.classList.add("transition-in");
        transitionTimer = null;
        updateProgress();
      }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 350);
    }
    function updateProgress() {
      document.getElementById("progressFill").style.width = `${Math.min(100,elapsed/ROTATION_MS*100)}%`;
    }
    function togglePause() {
      paused = !paused;

      lastTick = performance.now();
    }
    function loadAndRender() {
      const acreditaciones = leerAcreditaciones();
      const resultados = leerResultadosTodasAreas();
      const updated = calcularRankings(acreditaciones, resultados);
      if (transitionTimer !== null) {
        latestRankings = updated;
      } else {
        const signature = JSON.stringify([currentCategory, updated[CATEGORIES[currentCategory].id] || []]);
        if (signature !== renderedSignature) {
          // Los refrescos de datos no deben activar la animación de entrada.
          container.classList.remove("transition-in");
          renderRankings(updated);
        } else {
          latestRankings = updated;
        }
      }
      setLastUpdate();
    }
    loadAndRender();
    setInterval(() => {
      const now = performance.now();
      if (!paused) {
        elapsed += Math.min(now-lastTick, 1000);
        if (elapsed >= ROTATION_MS) changeCategory(1);
        updateProgress();
      }
      lastTick = now;
    }, 100);
    // Refresco periódico, también cuando está pausada la rotación.
    setInterval(loadAndRender, 3000);
    function toggleFullscreen() {
      if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
      else document.documentElement.requestFullscreen?.().catch(()=>{});
    }
    window.addEventListener("storage", ev => {
      if (ev.key === STORAGE_ACREDITACIONES || AREAS.some(a => ev.key === RESULT_SYNC_PREFIX+a) || ev.key === null) loadAndRender();
    });
    document.addEventListener("keydown", ev => {
      if(["ArrowLeft","ArrowRight"," "].includes(ev.key)) ev.preventDefault();
      if(ev.key === "ArrowRight") changeCategory(1);
      else if(ev.key === "ArrowLeft") changeCategory(-1);
      else if(ev.key === " ") togglePause();
      else if(ev.key.toLowerCase() === "f") toggleFullscreen();
      else if(ev.key.toLowerCase() === "r") loadAndRender();
    });
  </script>
</body>
