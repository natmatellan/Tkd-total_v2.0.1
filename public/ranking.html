/* Broadcast finish: engraved panels, restrained metallic lighting and motion */
.screen{position:relative;isolation:isolate;perspective:1100px}
.category-heading{position:relative;overflow:hidden;background:linear-gradient(105deg,#071a30,#17476b 58%,#09223c);border-left:8px solid #6bd9f3;border-top:1px solid #6295b5;border-bottom:1px solid #020e1b;box-shadow:inset 0 1px rgba(255,255,255,.17),0 9px 24px #0005}

.ranking td:last-child{border-right:4px solid #3a9cc4}
.ranking tbody tr{transition:filter .25s}.ranking tbody tr:hover{filter:brightness(1.045)}
.top-bar{background:linear-gradient(90deg,#06182d,#102f4a)}
.bottom{border-top:1px solid #2f6585;box-shadow:0 -5px 18px #0003}
.screen.transition-out{animation:boardOut .35s cubic-bezier(.4,0,1,1) both}
.screen.transition-in .category-heading{animation:headingIn .48s cubic-bezier(.2,.7,.2,1) both}
.screen.transition-in .ranking,.screen.transition-in .empty{animation:boardIn .55s cubic-bezier(.16,.8,.2,1) both}
.screen.transition-in .ranking tbody tr{animation:rowIn .45s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--row) * 48ms)}

@keyframes headingIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes boardIn{from{opacity:0;transform:translateX(36px) rotateY(-2deg);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rowIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

#categoriesContainer[data-discipline="allAround"] .ranking tbody tr.rank-3 td:first-child{border-left-color:#ffb17c!important;box-shadow:inset 5px 0 15px #ffb17c55,0 0 18px #ffffff!important}
#categoriesContainer[data-discipline="allAround"] .ranking tbody tr:nth-child(-n+3) td:last-child{color:#064d72!important;text-shadow:0 0 10px #9beaff55!important}
/* Ninguna otra disciplina recibe fondos ni efectos de podio. */
</style>
</head>
<body>
<header><div><h1>TAEKWON-DO TOTAL</h1></div><div class="live">● LIVE</div></header>
<div class="top-bar"><div id="lastUpdate" class="last-update">Última actualización: —</div></div>
<main class="screen" id="categoriesContainer"></main>
<div class="bottom"><div class="progress"><div class="progress-fill" id="progressFill"></div></div></div>

<script>
    // ====== DATOS Y CATEGORÍAS ======
    const STORAGE_ACREDITACIONES = "ct_acreditaciones_v1";
    const RESULT_SYNC_PREFIX = "ct_results_sync_v1_";
    const TOP_N = 8;
    const PESOS_COMBATE = [
      {id:'c58',label:'Combate Total · Hasta 58 kg',min:-Infinity,max:58},
      {id:'c65',label:'Combate Total · +58 a 65 kg',min:58,max:65},
      {id:'c72',label:'Combate Total · +65 a 72 kg',min:65,max:72},
      {id:'c80',label:'Combate Total · +72 a 80 kg',min:72,max:80},
      {id:'c90',label:'Combate Total · +80 a 90 kg',min:80,max:90},
      {id:'c90plus',label:'Combate Total · Más de 90 kg',min:90,max:Infinity}
    ];
    const CATEGORIES = [
      {id:'allAround',label:'All Around',discipline:'allAround'},
      {id:'salto',label:'Salto en Alto',discipline:'salto'},
      {id:'rotura',label:'Rotura de Habilidad',discipline:'rotura'},
      {id:'lucha',label:'Lucha por Puntos',discipline:'lucha'},
      ...PESOS_COMBATE.map(p=>({...p,discipline:'combate'}))
    ];

    function safeParse(json,fallback){try{return JSON.parse(json)}catch{return fallback}}
    function leerAcreditaciones(){const a=safeParse(localStorage.getItem(STORAGE_ACREDITACIONES),[]);return Array.isArray(a)?a:[]}
    function obtenerAreas(acreditaciones){
      const areas=new Set(acreditaciones.map(c=>String(c.area??'').trim()).filter(Boolean));
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k?.startsWith(RESULT_SYNC_PREFIX)) areas.add(k.slice(RESULT_SYNC_PREFIX.length));
      }
      return [...areas];
    }
    function leerResultadosTodasAreas(acreditaciones){
      const resultados=[];
      for(const area of obtenerAreas(acreditaciones)){
        const obj=safeParse(localStorage.getItem(RESULT_SYNC_PREFIX+area),{});
        if(!obj || typeof obj!=='object' || Array.isArray(obj))continue;
        for(const [idStr,data] of Object.entries(obj)){
          if(data && typeof data==='object')resultados.push({area,id:String(idStr),...data});
        }
      }
      return resultados;
    }
    function parseNumero(v){if(v==null || v==='')return NaN;const n=Number(String(v).replace(',','.').trim());return Number.isFinite(n)?n:NaN}
    function parsePeso(v){
      if(v==null)return NaN;
      const m=String(v).replace(',','.').match(/\d+(?:\.\d+)?/);
      return m?Number(m[0]):NaN;
    }
    function parseTiempoFinToSeconds(val){
      if(val==null || val==='')return Infinity;
      if(typeof val==='number')return Number.isFinite(val)?val:Infinity;
      const str=String(val).trim().replace(',','.');
      if(!str)return Infinity;
      if(str.includes(':')){
        const parts=str.split(':');
        if(parts.length!==2)return Infinity;
        const mm=Number(parts[0]),ss=Number(parts[1]);
        return Number.isFinite(mm)&&Number.isFinite(ss)&&mm>=0&&ss>=0?mm*60+ss:Infinity;
      }
      const n=Number(str);return Number.isFinite(n)&&n>=0?n:Infinity;
    }
    function calcularRankings(acreditaciones,resultados){
      const byCat=Object.fromEntries(CATEGORIES.map(c=>[c.id,[]]));
      const idx=new Map(acreditaciones.filter(c=>c&&c.id!=null).map(c=>[String(c.id),c]));
      const allMap=new Map();
      const seen=new Set();
      for(const r of resultados){
        const key=String(r.id),comp=idx.get(key);
        if(!comp || !comp.acreditado || String(comp.area)!==String(r.area) || seen.has(key))continue;
        seen.add(key);
        const nombre=comp.nombre||comp.nombreCompleto||`ID ${key}`;
        const base={id:key,nombre,area:r.area};
        const salto=parseNumero(r.saltoPuntaje),rotura=parseNumero(r.roturaPuntaje),lucha=parseNumero(r.luchaPuntaje),combate=parseNumero(r.combatePuntaje);
        const hds=parseNumero(comp.hds);
        if(salto>0 && hds>0)byCat.salto.push({...base,altura:hds,puntaje:salto});
        if(rotura>0)byCat.rotura.push({...base,puntaje:rotura});
        if(lucha>0)byCat.lucha.push({...base,puntaje:lucha});
        const aa={salto:Math.max(0,salto||0),rotura:Math.max(0,rotura||0),lucha:Math.max(0,lucha||0),combate:Math.max(0,combate||0)};
        const total=aa.salto+aa.rotura+aa.lucha+aa.combate;
        if(total>0)allMap.set(key,{...base,puntaje:total,desglose:aa});
        // Combate: la categoría se determina por peso de acreditación.
        // Una finalización sin tiempo registrado equivale al tiempo reglamentario (120 s).
        const peso=parsePeso(comp.peso);
        const clase=PESOS_COMBATE.find(p=>peso>p.min&&peso<=p.max);
        const tieneCombate=(r.combatePuntaje!==undefined&&r.combatePuntaje!==null&&r.combatePuntaje!=='') ||
          (r.combateTiempoFin!==undefined&&r.combateTiempoFin!==null&&r.combateTiempoFin!=='');
        if(clase&&tieneCombate){
          const t=parseTiempoFinToSeconds(r.combateTiempoFin);
          byCat[clase.id].push({...base,peso,puntaje:Number.isFinite(combate)?combate:0,tiempoNum:Number.isFinite(t)?t:120,tiempoRaw:r.combateTiempoFin});
        }
      }
      byCat.allAround=[...allMap.values()];
      for(const cat of CATEGORIES){
        const list=byCat[cat.id];
        if(cat.discipline==='combate')list.sort((a,b)=>a.tiempoNum-b.tiempoNum||b.puntaje-a.puntaje||a.nombre.localeCompare(b.nombre));
        else if(cat.id==='salto')list.sort((a,b)=>b.altura-a.altura||b.puntaje-a.puntaje||a.nombre.localeCompare(b.nombre));
        else if(cat.id==='allAround')list.sort((a,b)=>b.puntaje-a.puntaje||desempateAllAround(a,b)||a.nombre.localeCompare(b.nombre));
        else list.sort((a,b)=>b.puntaje-a.puntaje||a.nombre.localeCompare(b.nombre));
        byCat[cat.id]=list.slice(0,TOP_N);
      }
      return byCat;
    }
    function desempateAllAround(a,b){
      const disciplinas=['salto','rotura','lucha','combate'];
      let victoriasA=0,victoriasB=0;
      for(const d of disciplinas){if(a.desglose[d]>b.desglose[d])victoriasA++;else if(b.desglose[d]>a.desglose[d])victoriasB++;}
      return victoriasB-victoriasA; // empate residual: pendiente de resolución del Juez Central
    }
    function formatScore(num){return Number(num||0).toFixed(3)}
    function formatSeconds(num){return Number.isFinite(num)?num.toFixed(3):'—'}
    function setLastUpdate(){
      const e=document.getElementById('lastUpdate'),now=new Date();
      e.textContent=`Última actualización: ${now.toLocaleDateString('es-AR')} ${now.toLocaleTimeString('es-AR')}`;
    }

    // ====== PRESENTACIÓN ROTATIVA ======
    const ROTATION_MS = 10000;
    let currentCategory = 0;
    let activeCategories = [];
    let paused = false;
    let elapsed = 0;
    let lastTick = performance.now();
    let latestRankings = {};
    const container = document.getElementById("categoriesContainer");
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function renderRankings(rankings) {
      latestRankings=rankings;
      const cat=activeCategories[currentCategory];
      if(!cat){
        container.removeAttribute('data-discipline');
        container.innerHTML='<div class="empty">ESPERANDO RESULTADOS</div>';
        renderedSignature='empty';
        return;
      }
      const list=rankings[cat.id]||[];
      container.dataset.discipline=cat.discipline;
      const special=cat.id==='salto'?'<th>Altura</th><th>Pts</th>':cat.discipline==='combate'?'<th>Tiempo</th><th>Pts</th>':'<th>Pts</th>';
      const rows=list.map((item,i)=>{
        let cells='';
        if(cat.id==='salto')cells=`<td>${Number(item.altura).toFixed(3)} m</td><td>${formatScore(item.puntaje)}</td>`;
        else if(cat.discipline==='combate')cells=`<td>${formatSeconds(item.tiempoNum)} s</td><td>${formatScore(item.puntaje)}</td>`;
        else cells=`<td>${formatScore(item.puntaje)}</td>`;
        return `<tr class="rank-${i+1}" style="--row:${i}"><td>${cat.id==='allAround'?String(i+1).padStart(2,'0'):escapeHTML(item.id)}</td><td title="${escapeHTML(item.nombre)}">${escapeHTML(item.nombre)}</td><td>${escapeHTML(item.area)}</td>${cells}</tr>`;
      }).join('');
      const subtitulo=cat.id==='allAround'?`TOP ${TOP_N}`:'FINALISTAS';
      container.innerHTML=`<div class="category-heading"><h2>${escapeHTML(cat.label)}</h2><p>${subtitulo}</p></div>`+
        (list.length?`<table class="ranking"><thead><tr><th>#</th><th>Nombre</th><th>Área</th>${special}</tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">SIN DATOS</div>');
      renderedSignature=JSON.stringify([cat.id,list]);
    }
    let transitionTimer = null;
    let renderedSignature = "";
    function changeCategory(step) {
      if (transitionTimer !== null || !activeCategories.length) return;
      elapsed = 0; lastTick = performance.now();
      container.classList.remove("transition-in");
      container.classList.add("transition-out");
      transitionTimer = setTimeout(() => {
        if(activeCategories.length) currentCategory = (currentCategory + step + activeCategories.length) % activeCategories.length;
        else currentCategory = 0;
        container.classList.remove("transition-out");
        renderRankings(latestRankings);
        void container.offsetWidth;
        container.classList.add("transition-in");
        transitionTimer = null;
        updateProgress();
      }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 350);
    }
    function updateProgress() {
      document.getElementById("progressFill").style.width = `${Math.min(100,elapsed/ROTATION_MS*100)}%`;
    }
    function togglePause() {
      paused = !paused;

      lastTick = performance.now();
    }
    function loadAndRender() {
      const acreditaciones = leerAcreditaciones();
      const resultados = leerResultadosTodasAreas(acreditaciones);
      const updated = calcularRankings(acreditaciones, resultados);
      const anterior = activeCategories[currentCategory]?.id;
      activeCategories = CATEGORIES.filter(cat => (updated[cat.id] || []).length > 0);
      const indiceAnterior = activeCategories.findIndex(cat => cat.id === anterior);
      currentCategory = indiceAnterior >= 0 ? indiceAnterior : 0;
      if (transitionTimer !== null) {
        latestRankings = updated;
      } else {
        const cat = activeCategories[currentCategory];
        const signature = cat ? JSON.stringify([cat.id, updated[cat.id] || []]) : 'empty';
        if (signature !== renderedSignature) {
          container.classList.remove('transition-in');
          renderRankings(updated);
          elapsed = 0;
          updateProgress();
        } else {
          latestRankings = updated;
        }
      }
      setLastUpdate();
    }
    loadAndRender();
    setInterval(() => {
      const now = performance.now();
      if (!paused) {
        elapsed += Math.min(now-lastTick, 1000);
        if (elapsed >= ROTATION_MS) changeCategory(1);
        updateProgress();
      }
      lastTick = now;
    }, 100);
    // Refresco periódico, también cuando está pausada la rotación.
    setInterval(loadAndRender, 3000);
    function toggleFullscreen() {
      if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
      else document.documentElement.requestFullscreen?.().catch(()=>{});
    }
    window.addEventListener("storage", ev => {
      if (ev.key === STORAGE_ACREDITACIONES || (ev.key?.startsWith(RESULT_SYNC_PREFIX)) || ev.key === null) loadAndRender();
    });
    document.addEventListener("keydown", ev => {
      if(["ArrowLeft","ArrowRight"," "].includes(ev.key)) ev.preventDefault();
      if(ev.key === "ArrowRight") changeCategory(1);
      else if(ev.key === "ArrowLeft") changeCategory(-1);
      else if(ev.key === " ") togglePause();
      else if(ev.key.toLowerCase() === "f") toggleFullscreen();
      else if(ev.key.toLowerCase() === "r") loadAndRender();
    });
  </script>
</body>
</html>
