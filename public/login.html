<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal de Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }
        
        .login-menu {
            display: inline-block;
            margin: 20px;
        }
        
        .login-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .login-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .login-btn i {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1);
        }
        
        .modal-header {
            padding: 20px;
            position: relative;
            border-bottom: 1px solid #eee;
        }
        
        .modal-header h2 {
            color: #333;
            font-weight: 600;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #777;
            transition: color 0.3s;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid #eee;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: white;
            color: #4285F4;
            border-bottom: 2px solid #4285F4;
        }
        
        .tab-content {
            padding: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        .form-group input:focus {
            border-color: #4285F4;
            outline: none;
        }
        
        .password-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 14px;
        }
        
        .remember {
            display: flex;
            align-items: center;
        }
        
        .remember input {
            margin-right: 5px;
        }
        
        .forgot {
            color: #4285F4;
            text-decoration: none;
        }
        
        .forgot:hover {
            text-decoration: underline;
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background: #3367D6;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #777;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            background: white;
            color: #757575;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .google-btn:hover {
            background: #f5f5f5;
        }
        
        .google-btn img {
            width: 20px;
            margin-right: 10px;
        }
        
        .signup-link {
            margin-top: 20px;
            color: #666;
        }
        
        .signup-link a {
            color: #4285F4;
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .modal {
                width: 95%;
            }
            
            .tab {
                padding: 12px;
                font-size: 14px;
            }
            
            .tab-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <ul class="login-menu">
            <li>
                <a href="#" class="login-btn" id="loginTrigger">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </a>
            </li>
        </ul>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Iniciar Sesión</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            
            <div class="tabs">
                <div class="tab active" data-tab="email">Email</div>
                <div class="tab" data-tab="google">Google</div>
            </div>
            
            <div class="tab-content">
                <div class="tab-panel" id="emailTab">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" placeholder="tu@email.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" placeholder="Tu contraseña" required>
                            
                            <div class="password-actions">
                                <div class="remember">
                                    <input type="checkbox" id="remember">
                                    <label for="remember">Recordarme</label>
                                </div>
                                <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
                            </div>
                        </div>
                        
                        <button type="submit" class="submit-btn">Iniciar Sesión</button>
                    </form>
                    
                    <div class="divider">
                        <span>O</span>
                    </div>
                    
                    <button class="google-btn" id="googleLogin">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
                        Iniciar sesión con Google
                    </button>
                    
                    <div class="signup-link">
                        ¿No tienes una cuenta? <a href="#">Regístrate</a>
                    </div>
                </div>
                
                <div class="tab-panel" id="googleTab" style="display: none;">
                    <div style="text-align: center; padding: 30px 0;">
                        <div style="font-size: 64px; color: #4285F4; margin-bottom: 20px;">
                            <i class="fab fa-google"></i>
                        </div>
                        <h3 style="margin-bottom: 20px; color: #555;">Iniciar sesión con Google</h3>
                        <p style="color: #777; margin-bottom: 30px;">Haz clic en el botón de abajo para autenticarte con tu cuenta de Google.</p>
                        
                        <button class="google-btn" style="max-width: 300px;">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
                            Autenticar con Google
                        </button>
                    </div>
                    
                    <div class="signup-link">
                        ¿No tienes una cuenta? <a href="#">Regístrate</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modalOverlay = document.getElementById('modalOverlay');
            const loginTrigger = document.getElementById('loginTrigger');
            const closeModal = document.getElementById('closeModal');
            const tabs = document.querySelectorAll('.tab');
            const loginForm = document.getElementById('loginForm');
            
            // Abrir modal
            loginTrigger.addEventListener('click', function(e) {
                e.preventDefault();
                modalOverlay.classList.add('active');
            });
            
            // Cerrar modal
            closeModal.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
            });
            
            // Cerrar al hacer clic fuera del modal
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                }
            });
            
            // Cambio de pestañas
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    // Remover clase active de todas las pestañas
                    tabs.forEach(t => t.classList.remove('active'));
                    
                    // Añadir clase active a la pestaña clickeada
                    this.classList.add('active');
                    
                    // Mostrar el contenido correspondiente
                    const tabName = this.getAttribute('data-tab');
                    document.getElementById('emailTab').style.display = tabName === 'email' ? 'block' : 'none';
                    document.getElementById('googleTab').style.display = tabName === 'google' ? 'block' : 'none';
                });
            });
            
            // Validación del formulario
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (!email || !password) {
                    alert('Por favor, completa todos los campos');
                    return;
                }
                
                if (!isValidEmail(email)) {
                    alert('Por favor, ingresa un email válido');
                    return;
                }
                
                // Simulación de inicio de sesión exitoso
                alert(`Inicio de sesión simulado para: ${email}`);
                modalOverlay.classList.remove('active');
            });
            
            // Función para validar email
            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            // Simular inicio de sesión con Google
            document.getElementById('googleLogin').addEventListener('click', function() {
                alert('Redirigiendo a Google para autenticación... (simulación)');
            });
        });
    </script>
</body>
</html>
